}

let latoSetupDone = false;
async function setupLatoFonts() {
  if (latoSetupDone) return true;
  if (typeof window === 'undefined' || !window.pdfMake) return false;
  try {
    const [resReg, resBold] = await Promise.all([
      fetch('https://fonts.gstatic.com/s/lato/v25/S6uyw4BMUTPHvxk.ttf'),
      fetch('https://fonts.gstatic.com/s/lato/v25/S6u9w4BMUTPHh6UVew8.ttf')
    ]);
    if (!resReg.ok || !resBold.ok) throw new Error('Erro ao descarregar fontes');
    const [bufReg, bufBold] = await Promise.all([resReg.arrayBuffer(), resBold.arrayBuffer()]);

    const toBase64 = buf => {
      let binary = '';
      const bytes = new Uint8Array(buf);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) binary += String.fromCharCode(bytes[i]);
      return window.btoa(binary);
    };

    window.pdfMake.vfs = window.pdfMake.vfs || {};
    window.pdfMake.vfs['Lato-Regular.ttf'] = toBase64(bufReg);
    window.pdfMake.vfs['Lato-Bold.ttf'] = toBase64(bufBold);

    window.pdfMake.fonts = {
      Lato: {
        normal: 'Lato-Regular.ttf',
        bold: 'Lato-Bold.ttf',
        italics: 'Lato-Regular.ttf',
        bolditalics: 'Lato-Bold.ttf'
      },
      Roboto: {
        normal: 'Roboto-Regular.ttf',
        bold: 'Roboto-Medium.ttf',
        italics: 'Roboto-Italic.ttf',
        bolditalics: 'Roboto-MediumItalic.ttf'
      }
    };
    latoSetupDone = true;
    return true;
  } catch (err) {
    console.warn('Fallback para fonte padrão no PDF:', err);
    return false;
  }
}

/* ============================================================================
 * DIASFIT v12.4 — Otimização e Resolução de Imagens para PDF
 * - Converte referências Wix e URLs remotos para miniaturas otimizadas em JPEG Base64
 * - Evita ficheiros PDF pesados redimensionando proporcionalmente para max 120px
 * - Suporta fotogramas estáticos representativos de vídeo (poster ou vídeo direto)
 * - Identifica claramente falhas ou imagens ausentes ("Sem foto" / "Vídeo")
 * ============================================================================ */
const imageCache = new Map();

async function carregarEOtimizarImagem(url, maxDim = 120, qualidade = 0.80) {
  if (!url || typeof url !== 'string' || !url.startsWith('http')) return null;
  if (imageCache.has(url)) return imageCache.get(url);

  return new Promise(resolve => {
    let resolved = false;
    const timer = setTimeout(() => {
      if (!resolved) {
        resolved = true;
        resolve(null);
      }
    }, 4500);

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (resolved) return;
      resolved = true;
      clearTimeout(timer);
      try {
        const origW = img.naturalWidth || img.width;
        const origH = img.naturalHeight || img.height;
        if (!origW || !origH) {
          resolve(null);
          return;
        }
        let w = origW;
        let h = origH;
        if (w > h) {
          if (w > maxDim) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          }
        } else {
          if (h > maxDim) {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, w);
        canvas.height = Math.max(1, h);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', qualidade);
        imageCache.set(url, dataUrl);
        resolve(dataUrl);
      } catch (err) {
        console.warn('[PDF] Aviso ao converter imagem para base64:', err.message);
        resolve(null);
      }
    };
    img.onerror = () => {
      if (!resolved) {
        resolved = true;
        clearTimeout(timer);
        resolve(null);
      }
    };
    img.src = url;
  });
}

async function extrairFotogramaVideo(videoUrl, posterUrl, maxDim = 120, qualidade = 0.80) {
  if (posterUrl && typeof posterUrl === 'string' && posterUrl.startsWith('http')) {
    const posterData = await carregarEOtimizarImagem(posterUrl, maxDim, qualidade);
    if (posterData) return posterData;
  }
  if (!videoUrl || typeof videoUrl !== 'string' || !videoUrl.startsWith('http')) return null;

  return new Promise(resolve => {
    let resolved = false;
    const timer = setTimeout(() => {
      if (!resolved) {
        resolved = true;
        resolve(null);
      }
    }, 4500);

    try {
      const vid = document.createElement('video');
      vid.crossOrigin = 'anonymous';
      vid.muted = true;
      vid.preload = 'metadata';

      vid.onloadeddata = () => {
        try {
          vid.currentTime = Math.min(1.0, (vid.duration || 1) / 2);
        } catch (_) {
          if (!resolved) {
            resolved = true;
            clearTimeout(timer);
            resolve(null);
          }
        }
      };

      vid.onseeked = () => {
        if (resolved) return;
        resolved = true;
        clearTimeout(timer);
        try {
          const origW = vid.videoWidth || 120;
          const origH = vid.videoHeight || 120;
          let w = origW;
          let h = origH;
          if (w > h) {
            if (w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            }
          } else {
            if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, w);
          canvas.height = Math.max(1, h);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(vid, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', qualidade);
          resolve(dataUrl);
        } catch (err) {
          console.warn('[PDF] Falha ao extrair fotograma de vídeo:', err.message);
          resolve(null);
        } finally {
          vid.src = '';
        }
      };

      vid.onerror = () => {
        if (!resolved) {
          resolved = true;
          clearTimeout(timer);
          resolve(null);
        }
      };

      vid.src = videoUrl;
    } catch (_) {
      if (!resolved) {
        resolved = true;
        clearTimeout(timer);
        resolve(null);
      }
    }
  });
}

async function carregarImagensExercicios(planos = []) {
  const tarefas = [];
  const erros = [];
  for (const plano of planos) {
    for (const ex of (plano.exercicios || [])) {
      tarefas.push(async () => {
        if (ex.imagemUrl) {
          const dUrl = await carregarEOtimizarImagem(ex.imagemUrl, 120, 0.80);
          if (dUrl) {
            ex.fotoDataUrl = dUrl;
            ex.erroImagem = false;
          } else {
            ex.fotoDataUrl = null;
            ex.erroImagem = true;
            ex.semFotoMotivo = 'Erro foto';
            erros.push(ex.nome || 'Exercício');
          }
        } else if (ex.posterUrl || ex.videoUrl || ex.video) {
          const dUrl = await extrairFotogramaVideo(ex.videoUrl, ex.posterUrl, 120, 0.80);
          if (dUrl) {
            ex.fotoDataUrl = dUrl;
            ex.erroImagem = false;
          } else {
            ex.fotoDataUrl = null;
            ex.erroImagem = true;
            ex.semFotoMotivo = 'Erro foto';
            erros.push((ex.nome || 'Exercício') + ' (vídeo)');
          }
        } else {
          ex.fotoDataUrl = null;
          ex.erroImagem = false;
          ex.semFotoMotivo = 'Sem foto';
        }
      });
    }
  }

  const batchSize = 6;
  for (let i = 0; i < tarefas.length; i += batchSize) {
    const batch = tarefas.slice(i, i + batchSize);
    await Promise.allSettled(batch.map(fn => fn()));
  }
  return { falhas: erros };
}

async function carregarImagensAlimentos(planos = []) {

  }

  const batchSize = 6;

}

    },
    layout: {
      fillColor: () => '#EDEDED',
      hLineColor: () => '#EDEDED',
      vLineColor: () => '#EDEDED',
      paddingLeft: () => 8,
      paddingRight: () => 8,
      paddingTop: () => 5,
      paddingBottom: () => 5
    },
    dontBreakRows: true,
    margin: [0, 0, 0, 8]
  });

  // 3. Estrutura e Calendário Semanal
  content.push(
    { text: 'ESTRUTURA E CALENDÁRIO SEMANAL', fontSize: 8.5, bold: true, color: '#2B2B2B', characterSpacing: 1, keepWithNext: true, margin: [0, 0, 0, 4] },
    {
      table: {
        widths: ['14.28%', '14.28%', '14.28%', '14.28%', '14.28%', '14.28%', '14.32%'],
        body: [calHeaderRow, calValRow]
      },
      layout: {
        hLineColor: () => '#EDEDED',
        vLineColor: () => '#EDEDED',
        paddingTop: () => 3,
        paddingBottom: () => 3,
        paddingLeft: () => 2,
        paddingRight: () => 2
      },
      dontBreakRows: true,
      margin: [0, 0, 0, 8]
    }
  );

  // 4. Caixa de Cardio e Instruções do Treinador (se existirem)
  if (atleta.cardio || atleta.instrucoes) {
    const stackNotas = [];
    if (atleta.cardio) {
      stackNotas.push({
        text: [{ text: 'Cardio planeado: ', bold: true, color: '#2B2B2B' }, { text: atleta.cardio, color: '#444444' }],
        fontSize: 8
      });
    }
    if (atleta.instrucoes) {
      stackNotas.push({
        text: [{ text: 'Instruções do treinador: ', bold: true, color: '#2B2B2B' }, { text: atleta.instrucoes, color: '#444444' }],
        fontSize: 8,
        margin: [0, atleta.cardio ? 2 : 0, 0, 0]
      });
    }

    content.push({
      table: {
        widths: ['100%'],
        body: [[{ stack: stackNotas }]]
      },
      layout: {
        fillColor: () => '#EDEDED',
        hLineColor: () => '#EDEDED',
        vLineColor: () => '#EDEDED',
        paddingLeft: () => 8,
        paddingRight: () => 8,
        paddingTop: () => 4,
        paddingBottom: () => 4
      },
      dontBreakRows: true,
      margin: [0, 0, 0, 8]
    });
  }

  // 5. Blocos de Treino (Treino A, B, C, D...)
  planos.forEach((plano, pIdx) => {
    const letras = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    const letra = letras[pIdx] || String(pIdx + 1);
    const numExs = (plano.exercicios || []).length;
    // Permite paginação natural sem limite artificial de 2 páginas
    const isPageBreak = pIdx > 0;

    // Evitar TREINO A — TREINO A, conservando nomes próprios dos exercícios.
    let nomeLimpo = String(plano.nome || '').trim();
    const regexPrefixo = new RegExp('^Treino\\s+' + letra + '(?=\\s|[-—–:]|$)\\s*[-—–:]?\\s*', 'i');
    nomeLimpo = nomeLimpo.replace(regexPrefixo, '').trim();
    const tituloTreino = 'TREINO ' + letra + (nomeLimpo ? ' — ' + nomeLimpo.toUpperCase() : '');

    content.push({
      columns: [
        {
          text: [
            { text: tituloTreino, fontSize: 10, bold: true, color: '#2B2B2B' },
            plano.gruposMusculares ? { text: ' (' + plano.gruposMusculares + ')', fontSize: 8.5, color: '#555555', bold: false } : ''
          ]
        },
        {
          text: numExs + ' ' + (numExs === 1 ? 'exercício' : 'exercícios'),
          alignment: 'right',
          fontSize: 8,
          color: '#2B2B2B',
          bold: true
        }
      ],
      pageBreak: isPageBreak ? 'before' : undefined,
      keepWithNext: true,
      margin: [0, (pIdx === 0 || isPageBreak) ? 2 : 8, 0, 4]
    });

    const exTableBody = [
      [
        { text: '#', bold: true, fontSize: 7.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
        { text: 'Foto', bold: true, fontSize: 7.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
        { text: 'Exercício', bold: true, fontSize: 7.5, fillColor: '#D4C4B4', color: '#2B2B2B' },
        { text: 'Séries', bold: true, fontSize: 7.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
        { text: 'Reps', bold: true, fontSize: 7.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
        { text: 'Descanso', bold: true, fontSize: 7.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
        { text: 'Notas & Instruções Técnicas', bold: true, fontSize: 7.5, fillColor: '#D4C4B4', color: '#2B2B2B' }
      ]
    ];

    (plano.exercicios || []).forEach((ex, eIdx) => {
      const isEven = eIdx % 2 === 1;
      const rowBg = isEven ? '#EDEDED' : '#FFFFFF';

      const allReps = (Array.isArray(ex.repsIndividuais) && ex.repsIndividuais.length > 0)
        ? ex.repsIndividuais
        : [ex.repeticoes, ex.reps2, ex.reps3, ex.reps4, ex.reps5, ex.reps6]
            .map(r => (r !== null && r !== undefined ? String(r).trim() : ''))
            .filter(Boolean);

      // Repetições empilhadas evitam colisões de texto na coluna estreita do A4.
      const repsTexto = allReps.length ? allReps.join('\n') : '—';

      // O apóstrofo é minuto: 2' = 2 min, nunca 2's.
      const descansoOriginal = String(ex.descanso ?? '').trim();
      let descansoTexto = descansoOriginal || '—';
      if (/^\d+(?:[.,]\d+)?\s*['′]$/.test(descansoOriginal)) {
        descansoTexto = descansoOriginal.replace(/\s*['′]$/, '') + ' min';
      } else if (/^\d+(?:[.,]\d+)?\s*["″]$/.test(descansoOriginal)) {
        descansoTexto = descansoOriginal.replace(/\s*["″]$/, '') + ' s';
      } else if (/^\d+(?:[.,]\d+)?$/.test(descansoOriginal)) {
        descansoTexto = descansoOriginal + ' s';
      }

      const partesNotas = [];
      if (ex.observacoes) partesNotas.push(ex.observacoes);
      if (ex.intensidade) partesNotas.push('Intensidade: ' + ex.intensidade);
      const notasTexto = partesNotas.length ? partesNotas.join(' · ') : '—';

      const cellFoto = ex.fotoDataUrl
        ? { image: ex.fotoDataUrl, width: 34, height: 34, alignment: 'center', fillColor: rowBg }
        : ex.erroImagem
          ? { text: '⚠ Erro\nfoto', fontSize: 5.5, bold: true, color: '#c53030', alignment: 'center', margin: [0, 8, 0, 0], fillColor: '#fff5f5' }
          : { text: ex.semFotoMotivo || 'Sem foto', fontSize: 6.5, color: '#888888', alignment: 'center', margin: [0, 11, 0, 0], fillColor: rowBg };

      exTableBody.push([
        { text: String(eIdx + 1), alignment: 'center', fontSize: 7.5, color: '#555555', fillColor: rowBg, margin: [0, 10, 0, 0] },
        cellFoto,
        { text: ex.nome || 'Exercício', bold: true, fontSize: 8, color: '#2B2B2B', fillColor: rowBg, margin: [0, 4, 0, 0] },
        { text: String(ex.series || '—'), alignment: 'center', bold: true, fontSize: 8, color: '#2B2B2B', fillColor: rowBg, margin: [0, 10, 0, 0] },
        { text: repsTexto, alignment: 'center', fontSize: 7.5, color: '#2B2B2B', fillColor: rowBg, margin: [0, 10, 0, 0] },
        { text: descansoTexto || '—', alignment: 'center', fontSize: 7.5, color: '#555555', fillColor: rowBg, margin: [0, 10, 0, 0] },
        { text: notasTexto, fontSize: 7, color: '#555555', fillColor: rowBg, margin: [0, 4, 0, 0] }
      ]);
    });

    content.push({
      table: {
        headerRows: 1,
        dontBreakRows: true,
        widths: [14, 40, '*', 28, 52, 38, 120],
        body: exTableBody
      },
      layout: {
        hLineColor: () => '#EDEDED',
        vLineColor: () => '#EDEDED',
        paddingLeft: () => 4,
        paddingRight: () => 4,
        paddingTop: () => 2.5,
        paddingBottom: () => 2.5
      },
      margin: [0, 0, 0, 8]
    });
  });

  return {
    pageSize: 'A4',
    pageOrientation: 'portrait',
    pageMargins: [32, 22, 32, 22],
    defaultStyle: { font: fontFam },
    header: pdfRunningHeader('Plano de Treino Individualizado', atleta.nome, useLato),
    footer: pdfFooter(useLato),
    content
  };
}

function tituloRefeicaoPdf(ref = {}) {
  // Eliminar IDs internos da Wix apenas no documento; não modificar o CMS.
  const ordem = Number(ref.ordem) || 1;
  const base = 'Refeição ' + ordem;
  const original = String(ref.titulo || '').replace(/\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b/gi, '').trim();
  const prefixo = original.match(/^Refeiç[aã]o\s*(\d+)\b\s*[-—–:·]?\s*/i);
  const semPrefixo = prefixo && Number(prefixo[1]) === ordem ? original.slice(prefixo[0].length) : original;
  const titulo = semPrefixo.replace(/^[\s\-—–:·]+|[\s\-—–:·]+$/g, '').trim();
  return titulo ? base + ' — ' + titulo : base;
}

function buildDiasfitAlimentacaoDoc(dados, logoDataUrl, useLato) {

            ]
          },
          {
            stack: [
              atleta.agua ? { text: [{ text: 'Hidratação: ', color: '#555555' }, { text: atleta.agua, color: '#2B2B2B', bold: true }], fontSize: 8.5 } : { text: [{ text: 'Hidratação: ', color: '#555555' }, { text: 'Não especificada', color: '#777777', italic: true }], fontSize: 8.5 },
              { text: [{ text: 'Próxima revisão: ', color: '#555555' }, { text: atleta.proximaRevisao ? new Date(atleta.proximaRevisao).toLocaleDateString('pt-PT') : 'A definir', color: '#2B2B2B' }], fontSize: 8, margin: [0, 1.5, 0, 0] }
            ]
          }
        ]
      ]
    },
    layout: {
      fillColor: () => '#EDEDED',
      hLineColor: () => '#EDEDED',
      vLineColor: () => '#EDEDED',
      paddingLeft: () => 8,
      paddingRight: () => 8,
      paddingTop: () => 4,
      paddingBottom: () => 4
    },
    dontBreakRows: true,
    margin: [0, 0, 0, 6]
  });

  // 3. Resumo Comparativo dos Planos
  content.push(
    { text: 'RESUMO COMPARATIVO DOS PLANOS EM VIGOR', fontSize: 8.5, bold: true, color: '#2B2B2B', characterSpacing: 1, keepWithNext: true, margin: [0, 0, 0, 3] }
  );

  const resBody = [
    [
      { text: 'Plano / Métrica', bold: true, fontSize: 7.5, fillColor: '#D4C4B4', color: '#2B2B2B' },
      { text: 'Calorias', bold: true, fontSize: 7.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
      { text: 'Proteína (P)', bold: true, fontSize: 7.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
      { text: 'Hidratos (HC)', bold: true, fontSize: 7.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
      { text: 'Gordura (G)', bold: true, fontSize: 7.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
      { text: 'Refeições / Estado', bold: true, fontSize: 7.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' }
    ]
  ];

  planos.forEach(p => {
    const nomePlano = p.nome || ('Plano ' + p.plano);
    const objCal = (p.objetivos?.calorias != null) ? p.objetivos.calorias : p.calorias;
    const objProt = (p.objetivos?.proteina != null) ? p.objetivos.proteina : p.proteina;
    const objHidr = (p.objetivos?.hidratos != null) ? p.objetivos.hidratos : p.hidratos;
    const objGord = (p.objetivos?.gordura != null) ? p.objetivos.gordura : p.gordura;

    const totCal = p.totaisRefeicoes?.calorias;
    const totProt = p.totaisRefeicoes?.proteina;
    const totHidr = p.totaisRefeicoes?.hidratos;
    const totGord = p.totaisRefeicoes?.gordura;

    const difCal = p.diferencas?.calorias;
    const difProt = p.diferencas?.proteina;
    const difHidr = p.diferencas?.hidratos;
    const difGord = p.diferencas?.gordura;

    const fmtDiff = (val, un) => {
      if (val === null || val === undefined) return '—';
      if (val === 0) return '0' + un;
      return (val > 0 ? '+' : '') + val + un;
    };

    // Linha 1: Meta Prescrita
    resBody.push([
      { text: nomePlano + ' (Meta Prescrita)', bold: true, fontSize: 7.5, color: '#2B2B2B', fillColor: '#EDEDED' },
      { text: objCal != null ? objCal + ' kcal' : '—', alignment: 'center', bold: true, fontSize: 7.5, color: '#2B2B2B', fillColor: '#EDEDED' },
      { text: objProt != null ? objProt + 'g' : '—', alignment: 'center', fontSize: 7.5, color: '#2B2B2B', fillColor: '#EDEDED' },
      { text: objHidr != null ? objHidr + 'g' : '—', alignment: 'center', fontSize: 7.5, color: '#2B2B2B', fillColor: '#EDEDED' },
      { text: objGord != null ? objGord + 'g' : '—', alignment: 'center', fontSize: 7.5, color: '#2B2B2B', fillColor: '#EDEDED' },
      { text: (p.refeicoes || []).length + ' refeições', alignment: 'center', fontSize: 7.5, color: '#555555', fillColor: '#EDEDED' }
    ]);

    // Linha 2: Soma Real das Refeições
    resBody.push([
      { text: '   – Soma Real das Refeições', fontSize: 7, color: '#555555', fillColor: '#FFFFFF' },
      { text: totCal != null ? totCal + ' kcal' : '—', alignment: 'center', bold: true, fontSize: 7, color: '#2B2B2B', fillColor: '#FFFFFF' },
      { text: totProt != null ? totProt + 'g' : '—', alignment: 'center', fontSize: 7, color: '#2B2B2B', fillColor: '#FFFFFF' },
      { text: totHidr != null ? totHidr + 'g' : '—', alignment: 'center', fontSize: 7, color: '#2B2B2B', fillColor: '#FFFFFF' },
      { text: totGord != null ? totGord + 'g' : '—', alignment: 'center', fontSize: 7, color: '#2B2B2B', fillColor: '#FFFFFF' },
      { text: 'Total calculado', alignment: 'center', fontSize: 7, color: '#777777', fillColor: '#FFFFFF' }
    ]);

    // Linha 3: Diferenças Identificadas / Alinhamento
    const metasComparar = [objCal, objProt, objHidr, objGord];
    const desviosComparar = [difCal, difProt, difHidr, difGord];
    const comparacaoCompleta = metasComparar.every((m, i) =>
      Number.isFinite(Number(m)) && Number(m) > 0 &&
      desviosComparar[i] !== null && desviosComparar[i] !== undefined &&
      Number.isFinite(Number(desviosComparar[i]))
    );
    const diferencasExatas = comparacaoCompleta && desviosComparar.every(d => Number(d) === 0);
    const dentroUmPorCento = comparacaoCompleta && metasComparar.every((m, i) =>
      Math.abs(Number(desviosComparar[i])) <= Number(m) * 0.01 + 1e-9
    );
    const statusAlinhamento = !comparacaoCompleta ? 'Dados incompletos'
      : diferencasExatas ? 'Alinhado (100%)'
      : dentroUmPorCento ? 'Alinhado (±1%)'
      : 'Diferença Identificada';

    resBody.push([
      { text: '   – Diferença / Desvio', bold: true, fontSize: 7, color: '#777777', fillColor: '#FFFFFF' },
      { text: fmtDiff(difCal, ' kcal'), alignment: 'center', bold: true, fontSize: 7, color: '#2B2B2B', fillColor: '#FFFFFF' },
      { text: fmtDiff(difProt, 'g'), alignment: 'center', fontSize: 7, color: '#2B2B2B', fillColor: '#FFFFFF' },
      { text: fmtDiff(difHidr, 'g'), alignment: 'center', fontSize: 7, color: '#2B2B2B', fillColor: '#FFFFFF' },
      { text: fmtDiff(difGord, 'g'), alignment: 'center', fontSize: 7, color: '#2B2B2B', fillColor: '#FFFFFF' },
      { text: statusAlinhamento, alignment: 'center', bold: true, fontSize: 7, color: '#2B2B2B', fillColor: '#FFFFFF' }
    ]);
  });

  content.push({
    table: {
      headerRows: 1,
      dontBreakRows: true,
      widths: ['30%', '16%', '13%', '13%', '13%', '15%'],
      body: resBody
    },
    layout: {
      hLineColor: () => '#EDEDED',
      vLineColor: () => '#EDEDED',
      paddingTop: () => 1.8,
      paddingBottom: () => 1.8,
      paddingLeft: () => 5,
      paddingRight: () => 5
    },
    margin: [0, 0, 0, 6]
  });

  // 4. Detalhe de cada Plano Alimentar
  planos.forEach((p, pIdx) => {
    const objCal = (p.objetivos?.calorias != null) ? p.objetivos.calorias : p.calorias;
    const objProt = (p.objetivos?.proteina != null) ? p.objetivos.proteina : p.proteina;
    const objHidr = (p.objetivos?.hidratos != null) ? p.objetivos.hidratos : p.hidratos;
    const objGord = (p.objetivos?.gordura != null) ? p.objetivos.gordura : p.gordura;

    const macrosResumo = [
      objCal != null ? 'Meta: ' + objCal + ' kcal' : '',
      objProt != null ? 'P: ' + objProt + 'g' : '',
      objHidr != null ? 'H: ' + objHidr + 'g' : '',
      objGord != null ? 'G: ' + objGord + 'g' : ''
    ].filter(Boolean).join(' · ');

    const isPageBreak = pIdx > 0; // Cada plano subsequente começa na página seguinte

    content.push({
      table: {
        widths: ['*'],
        body: [
          [
            {
              columns: [
                { text: (p.nome || ('PLANO ' + p.plano)).toUpperCase(), bold: true, fontSize: 9, color: '#2B2B2B' },
                { text: macrosResumo, alignment: 'right', fontSize: 7.5, color: '#2B2B2B', bold: true }
              ],
              fillColor: '#D4C4B4',
              margin: [4, 1.2, 4, 1.2]
            }
          ]
        ]
      },
      layout: 'noBorders',
      pageBreak: isPageBreak ? 'before' : undefined,
      keepWithNext: true,
      margin: [0, isPageBreak ? 0 : 1, 0, 4]
    });

    (p.refeicoes || []).forEach(ref => {
      const mealElements = [];

      mealElements.push({
        text: [
          { text: tituloRefeicaoPdf(ref), bold: true, fontSize: 8, color: '#2B2B2B' },
          ref.preTreino ? { text: ' [REFEIÇÃO PRÉ-TREINO]', bold: true, fontSize: 7, color: '#2B2B2B' } : ''
        ],
        margin: [0, 2.5, 0, 1]
      });

      const refBody = [
        [
          { text: 'Foto', bold: true, fontSize: 6.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
          { text: 'Alimento', bold: true, fontSize: 6.5, fillColor: '#D4C4B4', color: '#2B2B2B' },
          { text: 'Quantidade', bold: true, fontSize: 6.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
          { text: 'Proteína', bold: true, fontSize: 6.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
          { text: 'Hidratos', bold: true, fontSize: 6.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
          { text: 'Gordura', bold: true, fontSize: 6.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' },
          { text: 'Kcal', bold: true, fontSize: 6.5, alignment: 'center', fillColor: '#D4C4B4', color: '#2B2B2B' }

      (ref.alimentos || []).forEach((al, alIdx) => {

        refBody.push([
          cellFoto,
          { text: al.nome || 'Alimento', bold: true, fontSize: 7, color: '#2B2B2B', fillColor: rowBg, margin: [0, 6, 0, 0] },
          { text: al.quantidade || '—', alignment: 'center', fontSize: 7, color: '#444444', fillColor: rowBg, margin: [0, 6, 0, 0] },
          { text: al.proteina || '—', alignment: 'center', fontSize: 6.5, color: '#555555', fillColor: rowBg, margin: [0, 6, 0, 0] },

          { text: al.gordura || '—', alignment: 'center', fontSize: 6.5, color: '#555555', fillColor: rowBg, margin: [0, 6, 0, 0] },
          { text: al.kcal ? String(al.kcal) : '—', alignment: 'center', bold: true, fontSize: 6.5, color: '#2B2B2B', fillColor: rowBg, margin: [0, 6, 0, 0] }
        ]);
      });

      if (ref.subtotal) {
        refBody.push([
          { text: 'Subtotal da Refeição', colSpan: 2, bold: true, fontSize: 6.5, color: '#2B2B2B', fillColor: '#EDEDED' },
          {},
          { text: '—', alignment: 'center', fontSize: 6.5, color: '#777777', fillColor: '#EDEDED' },
          { text: ref.subtotal.proteina || '—', alignment: 'center', bold: true, fontSize: 6.5, color: '#2B2B2B', fillColor: '#EDEDED' },
          { text: ref.subtotal.hidratos || '—', alignment: 'center', bold: true, fontSize: 6.5, color: '#2B2B2B', fillColor: '#EDEDED' },
          { text: ref.subtotal.gordura || '—', alignment: 'center', bold: true, fontSize: 6.5, color: '#2B2B2B', fillColor: '#EDEDED' },
          { text: (ref.subtotal.kcal && ref.subtotal.kcal !== '—') ? String(ref.subtotal.kcal) + ' kcal' : '—', alignment: 'center', bold: true, fontSize: 6.5, color: '#2B2B2B', fillColor: '#EDEDED' }
        ]);
      }

      mealElements.push({
        table: {
          headerRows: 1,
          dontBreakRows: true,
          widths: [36, '*', 54, 42, 42, 42, 38],
          body: refBody
        },
        layout: {
          hLineColor: () => '#EDEDED',
          vLineColor: () => '#EDEDED',
          paddingTop: () => 1.8,
          paddingBottom: () => 1.8,
          paddingLeft: () => 4,
          paddingRight: () => 4
        },
        margin: [0, 0, 0, ref.suplementacao ? 1.5 : 3.5]
      });

      if (ref.suplementacao) {
        mealElements.push({
          text: [{ text: 'Suplementação recomendada: ', bold: true, color: '#555555' }, { text: ref.suplementacao, color: '#444444' }],
          fontSize: 6.5,
          margin: [0, 0, 0, 3.5]
        });
      }

      content.push({
        unbreakable: true,
        stack: mealElements
      });
    });
  });

  // 5. Equivalências prescritas ao atleta (apenas se expressamente configuradas no CMS)
  const equivalenciasAtleta = Array.isArray(dados.equivalencias) ? dados.equivalencias : (
    planos.flatMap(p => Array.isArray(p.equivalencias) ? p.equivalencias : [])
  );

  if (equivalenciasAtleta.length > 0) {
    const eqBody = [
      [
        { text: 'Alimento de Referência', bold: true, fontSize: 7.5, fillColor: '#D4C4B4', color: '#2B2B2B' },
        { text: 'Substituição Prescrita', bold: true, fontSize: 7.5, fillColor: '#D4C4B4', color: '#2B2B2B' },
        { text: 'Observações', bold: true, fontSize: 7.5, fillColor: '#D4C4B4', color: '#2B2B2B' }
      ]
    ];
    equivalenciasAtleta.forEach((eq, idx) => {
      const rowBg = idx % 2 === 1 ? '#EDEDED' : '#FFFFFF';
      eqBody.push([
        { text: eq.origem || eq.referencia || 'Alimento', bold: true, fontSize: 7.5, color: '#2B2B2B', fillColor: rowBg },
        { text: eq.substituto || eq.equivalente || '—', fontSize: 7.5, color: '#444444', fillColor: rowBg },
        { text: eq.notas || eq.observacoes || '—', fontSize: 7, color: '#555555', fillColor: rowBg }
      ]);
    });

    content.push(
      { text: 'EQUIVALÊNCIAS E SUBSTITUIÇÕES PRESCRITAS', fontSize: 8.5, bold: true, color: '#2B2B2B', characterSpacing: 1, keepWithNext: true, margin: [0, 6, 0, 3] },
      {
        table: {
          headerRows: 1,
          dontBreakRows: true,
          widths: ['35%', '40%', '25%'],
          body: eqBody
        },
        layout: {
          hLineColor: () => '#EDEDED',
          vLineColor: () => '#EDEDED',
          paddingTop: () => 2.5,
          paddingBottom: () => 2.5,
          paddingLeft: () => 5,
          paddingRight: () => 5
        },
        margin: [0, 0, 0, 6]
      }
    );
  }

  return {
    pageSize: 'A4',
    pageOrientation: 'portrait',
    pageMargins: [32, 22, 32, 22],
    defaultStyle: { font: fontFam },
    header: pdfRunningHeader('Plano Alimentar Personalizado', atleta.nome, useLato),
    footer: pdfFooter(useLato),
    content
  };
}

function descarregarEPartilharPdf(blob, nomeFicheiro, titulo, atleta) {
  const blobUrl = URL.createObjectURL(blob);

  // 1. Trigger de download automático no computador
  const a = document.createElement('a');
  a.href = blobUrl;
  a.download = nomeFicheiro;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => document.body.removeChild(a), 100);

  // 2. Verificar suporte a partilha nativa (iOS / Android / Safari / Chrome Mobile)
  const file = new File([blob], nomeFicheiro, { type: 'application/pdf' });
  const podePartilhar = !!(navigator.canShare && navigator.canShare({ files: [file] }));

  // 3. Exibir modal de confirmação com opções de WhatsApp, Partilha e Novo Download
  mostrarModalExportacaoPdf({
    blob,
    blobUrl,
    nomeFicheiro,
    titulo,
    atleta,
    podePartilhar,
    file
  });
}

ACT.exportarPdfTreino = async btn => {
  if (!S.fichaId) return;
  busy(btn, true, 'A preparar treino…');
  try {
    const res = await call('exportarTreino', { atletaRegistoId: S.fichaId });
    if (!res || !res.ok) {
      toast(res?.error || res?.motivo || 'Erro ao obter dados de treino.', 'error');
      busy(btn, false);
      return;
    }
    if (res.vazio) {
      toast(res.motivo || 'O atleta não tem planos de treino registados.', 'warn');
      busy(btn, false);
      return;
    }
    if (res.incompleto) {
      toast(res.motivo || 'O plano de treino está incompleto.', 'error');
      busy(btn, false);
      return;
    }
    busy(btn, true, 'A carregar imagens dos exercícios…');
    const resImagensTreino = await carregarImagensExercicios(res.dados.planos);
    if (resImagensTreino && resImagensTreino.falhas && resImagensTreino.falhas.length > 0) {
      toast(`Aviso: ${resImagensTreino.falhas.length} imagem(ns) de exercícios não carregaram e surgem assinaladas no PDF como "Erro foto".`, 'warn');
    }
    busy(btn, true, 'A gerar documento…');
    await ensurePdfMakeLoaded();
    const logoUrl = await getDiasfitLogoDataUrl();
    const useLato = await setupLatoFonts();
    const docDef = buildDiasfitTreinoDoc(res.dados, logoUrl, useLato);
    window.pdfMake.createPdf(docDef).getBlob(blob => {
      busy(btn, false);
      const nomeLimpo = (res.dados.atleta?.nome || 'Atleta').replace(/[^a-zA-Z0-9À-ÿ]/g, '_');
      const dataHoje = new Date().toISOString().slice(0, 10);
      const nomeFicheiro = 'DIASFIT_Treino_' + nomeLimpo + '_' + dataHoje + '.pdf';
      descarregarEPartilharPdf(blob, nomeFicheiro, 'Plano de Treino', res.dados.atleta);
      toast('Plano de treino exportado com sucesso!', 'ok');
    });
  } catch (e) {
    busy(btn, false);
    toast(e.message || 'Erro ao exportar PDF.', 'error');
  }
};

/* ============================== Eventos ============================== */
function bind() {
  window.addEventListener('message', onMessage);
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (!fn) return;
    if (el.tagName !== 'A') e.preventDefault();
    fn(el, e);
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Escape') {
      if (S.pesquisaGlobal) {
        S.pesquisaGlobal = '';
        render();
        return;
      }
      if (S.view !== 'painel' && !e.target.closest('input, textarea, select')) ACT.voltar();
    }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.perfilField) {
      S.perfilDraft[el.dataset.perfilField] = el.value;
      return;
    }
    if (el.dataset.field) {
      S.draft[el.dataset.field] = el.value;
      const antes = !!$('.dirty');
      const agora = temAlteracoes();
      if (antes !== agora || el.tagName === 'SELECT' && el.dataset.field === 'tipoPagamento') {
        const pos = el.selectionStart; const key = el.dataset.field;
        render();
        const novo = $(`[data-field="${key}"]`);
        if (novo) { novo.focus(); try { if (pos != null) novo.setSelectionRange(pos, pos); } catch (_) {} }
      } else {
        $$('.save-bar').forEach(b => { const n = Object.keys(alteracoes()).length; const s = $('b', b); if (s) s.textContent = `${plural(n, 'alteração', 'alterações')} por guardar`; });
      }
      return;
    }
    if (el.id === 'pesquisaGlobal') {
      S.pesquisaGlobal = el.value;
      const pos = el.selectionStart;
      render();
      const n = $('#pesquisaGlobal');
      if (n) { n.focus(); try { if (pos != null) n.setSelectionRange(pos, pos); } catch (_) {} }
      return;
    }
    if (el.id === 'pesquisa') { S.pesquisa = el.value; $('#listaAtletas').innerHTML = htmlListaAtletas(); sendHeight(); return; }
    if (el.id === 'pesquisaMembros') { S.pesquisaMembros = el.value; const pos = el.selectionStart; render(); const n = $('#pesquisaMembros'); n.focus(); n.setSelectionRange(pos, pos); return; }
    if (el.matches('[data-wa]')) { const box = el.closest('.wa-box'); const a = $('[data-wa-link]', box); if (a) a.href = waHref(box.dataset.tel, el.value); return; }
    if (el.matches('input[type="date"][data-rf]')) {
      if (el.dataset.rf === 'data') el.dataset.manual = 'true';
      atualizarPreview(el);
    }
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.matches('[data-rf="periodicidadeAvaliacao"], [data-rf="diaSemanaAvaliacao"]')) {
      const card = el.closest('.rs');
      const inputData = card ? $('input[type="date"][data-rf="data"]', card) : null;
      if (inputData && (!inputData.dataset.manual || inputData.dataset.autoFilled === 'true')) {
        const a = atletaAtual() || {};
        const pVal = card.querySelector('[data-rf="periodicidadeAvaliacao"]')?.value || a.periodicidadeAvaliacao || 'Semanal';
        const dVal = card.querySelector('[data-rf="diaSemanaAvaliacao"]')?.value || a.diaSemanaAvaliacao || '';
        const sem = semanasPeriodicidade(pVal);
        const diaBase = proximoDiaSemana(dVal);
        const dSugerido = diaBase ? (sem > 1 ? addDaysISO(diaBase, (sem - 1) * 7) : diaBase) : addDaysISO(todayISO(), sem * 7);
        if (dSugerido) {
          inputData.value = dSugerido;
          inputData.dataset.autoFilled = 'true';
          atualizarPreview(inputData);
        }
      }
    }
    if (el.id === 'modeloMsg') { $('#waComposer').innerHTML = htmlWhatsApp(atletaAtual(), modeloMensagem(el.value, atletaAtual())); }
    if (el.matches('[data-perfil-field]')) { S.perfilDraft[el.dataset.perfilField] = el.value; render(); return; }
    if (el.matches('select[data-field]')) { S.draft[el.dataset.field] = el.value; render(); }
  });
  if (window.ResizeObserver) new ResizeObserver(sendHeight).observe($('#app')); else window.addEventListener('resize', sendHeight);
  window.addEventListener('beforeunload', e => { if (temAlteracoes()) { e.preventDefault(); e.returnValue = ''; } });
}

bind();
render();
sendRaw({ type: 'diasfit-ready', version: 4 }, true);
setTimeout(() => {
  if (!S.connected) {
    // Não substituir o diagnóstico de autorização já devolvido pela página.
    if (!S.erroDash) {
      S.erroDash = 'Sem ligação ao Wix. Confirma a sessão de administrador e recarrega a página.';
      render();
    }
    sendRaw({ type: 'diasfit-ready', version: 4 }, true);
  }
}, 3500);
})();
</script>
</body>
</html>
