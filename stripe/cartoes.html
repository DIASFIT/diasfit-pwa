<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--beige:#d4c4b4;--ink:#2b2b2b;--muted:#655f59;--gray:#ededed;--paper:#fff;--line:#e5dfd8}
*{box-sizing:border-box}html,body{padding:0;margin:0;background:transparent;font-family:Lato,Arial,sans-serif;color:var(--ink);overflow-x:hidden;overflow-y:auto}
#root{max-width:1180px;margin:0 auto;padding:24px 18px 22px}
.hero{text-align:center;max-width:750px;margin:0 auto 29px}
.eyebrow{display:block;text-transform:uppercase;letter-spacing:.17em;font-size:11px;font-weight:900;color:#9b8066;margin:0 0 12px}
.hero h2{font-size:clamp(24px,3vw,36px);line-height:1.18;margin:0 auto 12px;max-width:700px;letter-spacing:-.035em;font-weight:900;text-wrap:balance}
.hero p{font-size:clamp(14px,1.25vw,16px);color:var(--muted);line-height:1.55;margin:0 auto;max-width:550px;text-wrap:pretty}
.selector{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;max-width:max-content;margin:0 auto 26px;padding:5px;border:1px solid var(--line);border-radius:14px;background:#fff}
.selector button{appearance:none;background:transparent;border:0;border-radius:10px;font:800 13px Lato,Arial,sans-serif;padding:12px 22px;min-width:112px;min-height:44px;cursor:pointer;color:#62574e;transition:background .18s,color .18s,transform .18s}
.selector button[aria-pressed=true]{background:var(--ink);color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.12)}
.selector button:focus-visible,.action:focus-visible{outline:3px solid #a18463;outline-offset:3px}
.info{display:flex;align-items:center;justify-content:center;gap:8px;max-width:740px;margin:0 auto 22px;text-align:center;font-size:13px;color:#756d65;line-height:1.5;text-wrap:pretty}
.info strong{color:#3b342e}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.grid.cards-2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:900px;margin:0 auto}
.grid.cards-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.plan{display:flex;flex-direction:column;min-width:0;position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 9px 30px rgba(43,43,43,.065);transition:box-shadow .2s,transform .2s}
.plan:hover{box-shadow:0 13px 32px rgba(43,43,43,.11);transform:translateY(-2px)}
.plan.popular{border:1.5px solid #a18469;box-shadow:0 14px 32px rgba(118,87,54,.12)}
.plan.premium{border:2px solid #a18469;box-shadow:0 17px 36px rgba(112,79,46,.17);background:#fffdfb}
.plan.premium .top{background:#d9c9b8}
.plan.premium .tag{background:#2b2b2b;letter-spacing:.045em}
.plan.premium .features li:nth-child(-n+3){font-weight:800;color:#2b2b2b}
.plan.premium .features li:nth-child(-n+3):before{color:#856546}
.plan.premium .action{background:#252525}
.premium-line{color:#524439;font-size:12px;font-weight:800;letter-spacing:.005em;margin:1px auto 0}
.purchase{padding:4px 19px 20px;background:inherit}
.purchase .action{min-height:50px}
.plan.premium .purchase{padding:4px 18px 19px}
.plan.premium .name{font-size:16px}

.tag{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:10px;padding:7px 13px;border-radius:0 0 9px 9px;white-space:nowrap;z-index:1}
.top{display:flex;flex-direction:column;gap:0;align-items:center;background:#e2d6c9;text-align:center;padding:31px 20px 20px;flex:0 0 auto;min-height:275px}
.popular .top,.premium .top{padding-top:48px}
.name{font-size:15px;font-weight:900;letter-spacing:.015em;line-height:1.35;min-height:40px;display:flex;align-items:center;justify-content:center}
.price{display:flex;align-items:baseline;gap:3px;margin:11px 0 5px;font-size:clamp(36px,4vw,49px);line-height:1;font-weight:900;letter-spacing:-.06em}
.price sup{font-weight:800;font-size:18px;letter-spacing:0;align-self:flex-start;line-height:1.35}
.cadence{font-size:12px;font-weight:700;color:#5b5149;margin:0 0 14px}
.desc{font-size:13px;line-height:1.5;max-width:360px;color:#50453c;margin:0 0 17px;flex:1;text-wrap:pretty}
.action{border:0;border-radius:9px;background:var(--ink);color:#fff;min-height:47px;padding:12px 15px;width:100%;cursor:pointer;font:900 13px Lato,Arial,sans-serif;letter-spacing:.01em;transition:background .18s}
.action:hover{background:#564537}.action:disabled{opacity:.68;cursor:wait}
.action[aria-busy=true]::after{content:"";display:inline-block;width:11px;height:11px;margin-left:9px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;vertical-align:-1px;animation:df-spin .9s linear infinite}@keyframes df-spin{to{transform:rotate(360deg)}}
.retry-text{text-align:center;color:#514840;padding:18px 0}.retry-action{display:block;margin:0 auto;min-height:47px;border:0;border-radius:9px;background:var(--ink);color:white;padding:12px 28px;font:700 14px Lato,Arial,sans-serif;cursor:pointer}
.retry-action:focus-visible{outline:3px solid #a18463;outline-offset:3px}
.notice{display:none;color:#50453c;background:#f7f4f1;border-radius:8px;border:1px solid #c6b5a4;padding:12px;margin:12px 0 0;font-size:12px;line-height:1.5;text-align:left;width:100%}.notice.visible{display:block}
.notice.pending{background:#f4f1ed;border-color:#d9cec2}.action[aria-busy=true]{cursor:progress;opacity:.85}
.bottom{padding:18px 21px 20px;flex:1}
.features{padding:0;margin:0;list-style:none}.features li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;padding:9px 0;border-bottom:1px solid #f0edeb;color:#48413a;text-wrap:pretty}.features li:last-child{border:0}
.features li:before{content:'✓';flex:0 0 17px;color:#927453;font-weight:900}
.fine{margin:23px auto 0;text-align:center;font-size:12px;color:#6d665e;line-height:1.65;max-width:72ch;text-wrap:pretty}
.fine strong{color:var(--ink)}
@media(min-width:900px){.grid.cards-4 .top{padding-inline:14px}.grid.cards-4 .bottom{padding:16px}.grid.cards-4 .name{font-size:13px}.grid.cards-4 .features li{font-size:12px}}
@media(max-width:860px){#root{padding:24px 14px}.grid,.grid.cards-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.cards-2{max-width:690px}}
@media(max-width:600px){#root{padding:18px 13px 22px}.hero{margin-bottom:19px}.hero h2{font-size:clamp(23px,6.5vw,28px);line-height:1.2;max-width:22ch}.hero p{font-size:14px;max-width:33ch}.selector{width:100%;max-width:100%;margin-bottom:21px;gap:3px}.selector button{min-width:0;flex:1;font-size:12px;padding:12px 8px}.grid,.grid.cards-2,.grid.cards-4{grid-template-columns:minmax(0,1fr);max-width:430px;margin:0 auto;gap:15px}.top{min-height:0;padding:25px 17px 18px}.popular .top,.premium .top{padding-top:42px}.purchase{padding:4px 17px 19px}.plan.premium .purchase{padding:4px 16px 18px}.price{font-size:45px}.name{min-height:0}.desc{flex:0 0 auto;margin:0 0 16px}.bottom{padding:14px 19px 18px}.features li{font-size:14px}.desc{font-size:14px}.info{font-size:12px}.fine{font-size:12px;margin-top:20px;max-width:38ch}}
@media(prefers-reduced-motion:reduce){.plan,.selector button,.action{transition:none}.plan:hover{transform:none}.action[aria-busy=true]::after{animation:none}}
</style></head><body>

 activeGroup=group;selectedCode=null;
 const root=document.getElementById('root');root.replaceChildren();
 const hero=el('header','hero');hero.append(el('span','eyebrow',GROUPS[group].eyebrow),el('h2','',GROUPS[group].title),el('p','',GROUPS[group].description));root.append(hero);
 let list=CATALOG.filter(p=>GROUP_FILTER[group]?GROUP_FILTER[group].includes(p.group):p.group===group);
 const tabs=TABS[group];if(tabs){
  const selected=tabs.some(t=>t.id===activeTab[group])?activeTab[group]:tabs[0].id;activeTab[group]=selected;
  const bar=el('div','selector');bar.setAttribute('role','group');bar.setAttribute('aria-label',group==='PTGRUPO'?'Número de pessoas':'Duração do acompanhamento');
  for(const t of tabs){const btn=el('button','',t.text);btn.type='button';btn.setAttribute('aria-pressed',String(t.id===selected));btn.addEventListener('click',()=>{activeTab[group]=t.id;render(group);document.querySelector('.selector [aria-pressed=true]')?.focus({preventScroll:true})});bar.append(btn)}root.append(bar);
  const current=tabs.find(t=>t.id===selected);const info=el('p','info',current.desc);root.append(info);list=list.filter(p=>current.codes.includes(p.code));
 }
 const count=list.length;const grid=el('section','grid'+(count===2?' cards-2':count===4?' cards-4':''));grid.setAttribute('aria-label','Planos e preços DIASFIT');
 for(const p of list)grid.append(cardView(p,group));root.append(grid);
 const fine=el('p','fine');fine.append(document.createTextNode(TERMS[group][activeTab[group]||'DEFAULT']||TERMS[group].DEFAULT));root.append(fine);
 height();setTimeout(height,100)
}
window.addEventListener('message',event=>{if(event.source!==window.parent)return;const d=event.data;if(!d||typeof d!=='object')return;if(d.type==='DIASFIT_CARDS_SHOW')render(d.group,d.code);if(d.type==='DIASFIT_CARDS_NOTICE')notify(d.code,d.message,d.pending===true)});
window.addEventListener('resize',height);new ResizeObserver(height).observe(document.getElementById('root'));
function pedirPlanos(){post('DIASFIT_CARDS_READY')}
pedirPlanos();setTimeout(()=>{if(!activeGroup)pedirPlanos()},400);setTimeout(()=>{if(!activeGroup)pedirPlanos()},1300);
setTimeout(()=>{if(!activeGroup){const root=document.getElementById('root');root.replaceChildren();root.append(el('p','retry-text','Não conseguimos apresentar os planos neste momento.'));const retry=el('button','retry-action','Tentar novamente');retry.type='button';retry.addEventListener('click',()=>{root.replaceChildren(el('p','retry-text','A carregar os planos DIASFIT…'));pedirPlanos()});root.append(retry);height()}},7000);
</script></body></html>
