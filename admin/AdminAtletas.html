<!doctype html>
<html lang="pt-PT">
<head>
<!-- DIASFIT · Gestão de Atletas v12.3 · fontes canónicas, triagem estrita e pesquisa global. Ficheiro completo para Wix. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>DIASFIT · Gestão de Atletas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* Princípios v12.3: um próximo passo sempre visível; triagem rigorosa de novos/antigos;
   pesquisa global instantânea; transparência total de ações e fontes canónicas.
   Sem position:fixed para vistas: dentro do iframe da Wix a altura do componente
   acompanha o conteúdo, por isso a ficha é uma vista normal, não um painel lateral. */
:root{--ink:#2b2b2b;--ink2:#3b3834;--sand:#d4c4b4;--sand2:#bda996;--sandsoft:#f1e9e0;--paper:#ededed;--card:#fffdfa;--white:#fff;--muted:#746f69;--line:#e3ddd7;--line2:#cfc7bf;
--ok:#3f6b52;--okbg:#e5efe8;--warn:#8f6128;--warnbg:#f6ead8;--bad:#a1463f;--badbg:#f8e2de;--info:#35597d;--infobg:#e2ebf4;--wa:#1f8a4c;
--sh1:0 1px 2px rgba(43,43,43,.04),0 6px 20px rgba(43,43,43,.05);--sh2:0 2px 6px rgba(43,43,43,.05),0 16px 40px rgba(43,43,43,.09);--sh3:0 24px 70px rgba(30,27,24,.24);--sh-btn:0 4px 12px rgba(43,43,43,.20);--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{color:var(--ink);font:15.5px/1.5 Lato,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:15px}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;letter-spacing:-.03em;line-height:1.15}p{margin:0}
a{color:inherit}
.ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

/* Botões DIASFIT (10px cantos arredondados e sombra de 20%) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 18px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:800;font-size:14.5px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s,transform .12s var(--ease),box-shadow .15s;max-width:100%;box-shadow:var(--sh-btn)}
.btn:hover{background:#111;box-shadow:0 6px 16px rgba(43,43,43,.25)}.btn:active{transform:translateY(1px);box-shadow:0 2px 6px rgba(43,43,43,.20)}.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn.sec{background:var(--white);color:var(--ink);border-color:var(--line2);box-shadow:0 2px 6px rgba(43,43,43,.08)}.btn.sec:hover{background:var(--sandsoft);box-shadow:0 3px 10px rgba(43,43,43,.14)}
.btn.soft{background:var(--sandsoft);color:var(--ink);border-color:transparent;box-shadow:none}.btn.soft:hover{background:#e9dccf}
.btn.ghost{background:transparent;color:inherit;border-color:transparent;box-shadow:none}.btn.ghost:hover{background:rgba(43,43,43,.07)}
.btn.danger{background:var(--white);color:var(--bad);border-color:#e6c6c0;box-shadow:0 2px 6px rgba(161,70,63,.12)}.btn.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:0 4px 12px rgba(161,70,63,.25)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 4px 12px rgba(161,70,63,.20)}
.btn.ok{background:var(--ok);border-color:var(--ok);box-shadow:0 4px 12px rgba(63,107,82,.20)}.btn.ok:hover{background:#345a44;box-shadow:0 6px 16px rgba(63,107,82,.25)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;box-shadow:0 4px 12px rgba(31,138,76,.20)}.btn.wa:hover{background:#18723e;box-shadow:0 6px 16px rgba(31,138,76,.25)}
.btn.sm{min-height:36px;padding:7px 13px;font-size:13.5px;border-radius:8px}
.btn.sm .ic{width:15px;height:15px}
.btn.block{width:100%}
.link{border:0;background:none;padding:0;font-weight:900;text-decoration:underline;cursor:pointer;color:inherit}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .7s linear infinite}

/* Pesquisa Global no Topo */
.global-search-wrap{position:relative;margin-bottom:16px;z-index:40}
.global-search{display:flex;align-items:center;background:#fff;border:1px solid #dcd3ca;border-radius:12px;box-shadow:0 2px 6px rgba(43,43,43,.04);transition:all .15s;position:relative}
.global-search:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(212,196,180,.55)}
.global-search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:19px;height:19px}
.global-search input{border:0!important;background:transparent!important;box-shadow:none!important;padding:12px 42px 12px 44px!important;min-height:46px!important;font-size:15px;width:100%}
.clear-search-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:16px;font-weight:900;padding:6px;cursor:pointer;border-radius:50%;display:grid;place-items:center;width:28px;height:28px}
.clear-search-btn:hover{color:var(--ink);background:var(--sandsoft)}
.global-search-results{position:relative;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:14px 16px;margin-top:8px;box-shadow:var(--sh2);animation:rise .2s var(--ease)}
.global-search-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.global-search-head strong{display:block;font-size:14.5px;color:var(--ink)}
.global-search-list{max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.global-search-item{border:1px solid var(--line);border-radius:10px;padding:8px 10px;transition:background .12s}
.global-search-item:hover{background:var(--sandsoft);border-color:var(--sand2)}

/* Campos */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#5a534c}
.fld>small{color:#786f65;font-size:13px;line-height:1.35}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;min-height:44px;border:1px solid #ded6cd;border-radius:12px;padding:10px 14px;background:#fbf9f6;color:var(--ink);font-size:15px;line-height:1.4;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
input:not([type=checkbox]):not([type=radio]):hover,select:hover,textarea:hover{border-color:#cbbeaf}
textarea{min-height:92px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:0;background:#ffffff;border-color:var(--ink);box-shadow:0 0 0 3px rgba(212,196,180,.55)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.span-all{grid-column:1/-1}
.check{display:flex;align-items:flex-start;gap:10px;font-weight:700;font-size:14.5px;cursor:pointer;line-height:1.35}
.check input{width:19px;height:19px;margin:0;flex:0 0 auto;accent-color:var(--ink)}
.check small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}

/* Estrutura */
.app{max-width:1160px;margin:0 auto;padding:24px 20px 48px;width:100%}
.app:has(.f-head),.f-head,.tabs-wrap,.f-grid{max-width:1040px;margin-left:auto;margin-right:auto}
.card{background:#ffffff;border:1px solid #e7e0d7;border-radius:20px;padding:24px 26px;box-shadow:0 1px 3px rgba(43,43,43,.02),0 6px 18px rgba(43,43,43,.035);transition:border-color .15s}
.card+.card{margin-top:18px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.card-head h3{font-size:19px;font-weight:900;letter-spacing:-.03em;color:var(--ink)}
.card-head .eyebrow{margin-bottom:4px;color:#82796e}
.card-head p{color:var(--muted);font-size:14px;margin-top:4px;line-height:1.45}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:clamp(28px,3.8vw,36px);letter-spacing:-.045em;margin-top:4px;font-weight:900}
.top-actions{display:flex;gap:10px;flex-wrap:wrap}
.status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}.dot.on{background:var(--ok)}.dot.err{background:var(--bad)}
.dash{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
.dash-side{display:grid;gap:18px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.skel{height:64px;border-radius:14px;margin:8px 0;background:linear-gradient(90deg,#eee 25%,#f7f4f1 37%,#eee 63%);background-size:400% 100%;animation:shimmer 1.25s infinite}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 15px;border-radius:14px;background:var(--warnbg);color:#6b4b22;margin-bottom:14px;border:1px solid #ead5b6}
.banner>div{flex:1;min-width:200px}.banner strong{display:block}.banner small{display:block;font-size:13px;opacity:.9}
.banner.bad{background:var(--badbg);border-color:#ecc6c0;color:#7c332d}

/* Avatar e pills */
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--sandsoft);color:#6f5f51;font-weight:900;font-size:14.5px;flex:0 0 auto;letter-spacing:.02em}
.av.lg{width:60px;height:60px;border-radius:18px;font-size:20px;background:var(--sand);color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:#eee9e4;color:#534d47;font-size:12px;font-weight:800;white-space:nowrap}
.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.ok{background:var(--okbg);color:var(--ok)}.pill.info{background:var(--infobg);color:var(--info)}.pill.dark{background:var(--ink);color:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap}

/* Próximo passo (painel) */
.next{position:relative;overflow:hidden;background:linear-gradient(140deg,#2b2b2b 0%,#3d3935 100%);color:#fff;border-radius:26px;padding:26px 28px;box-shadow:var(--sh2);animation:rise .35s var(--ease)}
.next::after{content:'';position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(212,196,180,.30),transparent 70%);pointer-events:none}
.next .eyebrow{color:#d9cbbc;font-size:12px;letter-spacing:.1em}
.next-who{display:flex;align-items:center;gap:12px;margin-top:14px}
.next-who .av{background:rgba(255,255,255,.12);color:#fff}
.next-who b{display:block;font-size:15px;color:#e8e1da}
.next h2{font-size:clamp(23px,2.8vw,28px);margin-top:2px;letter-spacing:-.04em}
.next-why{color:#ddd5cd;margin-top:10px;max-width:640px;font-size:14.5px;line-height:1.45}
.next .pills{margin-top:14px}.next .pill{background:rgba(255,255,255,.12);color:#fff}.next .pill.bad{background:#c9665c;color:#fff}.next .pill.warn{background:#b58a4f;color:#fff}
.next-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;position:relative;z-index:1}
.next .btn{background:#fff;color:var(--ink);border-color:#fff}.next .btn:hover{background:var(--sandsoft)}
.next .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}.next .btn.ghost:hover{background:rgba(255,255,255,.1)}
.next.done{background:linear-gradient(140deg,#35503f,#2c4236)}
.next.done .eyebrow{color:#cfe6d6}
.progress{margin-top:20px;position:relative;z-index:1}
.progress-bar{height:7px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.progress-bar i{display:block;height:100%;border-radius:99px;background:var(--sand);transition:width .5s var(--ease)}
.progress small{display:block;margin-top:7px;color:#d4cbc2;font-size:12.5px}
.done-mark{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.14);animation:pop .45s var(--ease)}
.done-mark .ic{width:26px;height:26px;color:#dff0e4}

/* Fila */
.q-group{margin-top:18px}
.q-group>h4{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.q-group>h4 .pill{letter-spacing:0;text-transform:none}
.q-group.agora>h4{color:var(--bad)}
.q-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--white);margin-bottom:9px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s}
.q-row:hover{border-color:var(--line2);box-shadow:var(--sh1)}
.q-row.bad{box-shadow:inset 4px 0 0 var(--bad)}.q-row.warn{box-shadow:inset 4px 0 0 var(--sand2)}
.q-body{flex:1;min-width:0}
.q-body b{display:block;font-size:15.5px;line-height:1.3;font-weight:800}
.q-body span{display:block;color:var(--muted);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q-side{display:flex;align-items:center;gap:8px;flex:0 0 auto}
details.fold{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
details.fold>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:900;color:var(--muted);padding:6px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'+';margin-left:auto;font-size:18px;line-height:1}
details.fold[open]>summary::after{content:'-'}
.mini-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #efe9e3;font-size:14.5px}
.mini-row:last-child{border-bottom:0}
.mini-row .grow{flex:1;min-width:0}.mini-row small{display:block;color:var(--muted);font-size:12.5px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:15px 16px}
.kpi span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi strong{display:block;font-size:28px;font-weight:900;letter-spacing:-.03em;margin-top:3px;line-height:1.1}
.kpi small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.kpi.bad strong{color:var(--bad)}.kpi.ok strong{color:var(--ok)}
.meter{height:6px;border-radius:99px;background:#eee7e0;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* PT Resumo Card */
.pt-resumo-card{transition:border-color .15s,box-shadow .15s,transform .12s}
.pt-resumo-card:hover{border-color:var(--line2);box-shadow:var(--sh1)}
.pt-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pt-kpi{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.pt-kpi span{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-kpi strong{display:block;font-size:26px;font-weight:900;letter-spacing:-.03em;margin-top:3px;line-height:1.1;color:var(--ink)}

/* Agenda */
.ag-day{padding:10px 0;border-top:1px solid #efe9e3}.ag-day:first-of-type{border-top:0;padding-top:2px}
.ag-day>b{display:block;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ag-day.today>b{color:var(--ink)}
.ag-item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;padding:7px 4px;border-radius:9px;text-align:left;cursor:pointer;font-size:14.5px}
.ag-item:hover{background:var(--sandsoft)}
.ag-item .ic{color:var(--sand2);width:16px;height:16px}
.ag-item em{font-style:normal;color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap}

/* Lista de atletas */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1;min-width:220px}.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}.search input{padding-left:40px;min-height:42px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line2);background:var(--white);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip b{font-size:11.5px;background:var(--sandsoft);border-radius:999px;padding:2px 8px}
.chip:hover{border-color:var(--ink)}.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}.chip.on b{background:var(--sand);color:var(--ink)}
.ath{display:flex;align-items:center;gap:12px;padding:14px 8px;border-bottom:1px solid #efe9e3;cursor:pointer;border-radius:12px}
.ath:last-child{border-bottom:0}.ath:hover{background:#faf6f1}
.ath-body{flex:1;min-width:0}
.ath-body b{display:block;font-size:15.5px;font-weight:800}
.ath-body small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ath-status{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;max-width:48%}
.ath-status .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ath-status small{color:var(--muted);font-size:12px;white-space:nowrap}
.ath-status small.warn{color:var(--warn);font-weight:900}

/* Ficha */
.f-back{margin-bottom:14px;max-width:1040px;margin-left:auto;margin-right:auto}
.f-back .btn{color:#655e56;font-weight:800;font-size:14px;border-radius:10px}
.f-back .btn:hover{color:var(--ink);background:rgba(43,43,43,.06)}
.f-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:linear-gradient(180deg,#ffffff 0%,#fdfbf9 100%);border:1px solid #e5ded6;border-radius:22px;padding:24px 28px;box-shadow:0 2px 4px rgba(43,43,43,.02),0 10px 24px rgba(43,43,43,.04);max-width:1040px;margin:0 auto}
.f-head .av.lg{width:68px;height:68px;border-radius:22px;font-size:24px;font-weight:900;letter-spacing:.01em;background:linear-gradient(135deg,#e8dfd7 0%,#d4c4b4 100%);color:var(--ink);border:2px solid #fff;box-shadow:0 2px 10px rgba(43,43,43,.08);flex:0 0 auto}
.f-id{flex:1;min-width:240px}
.f-eyebrow{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#7c7267;margin-bottom:5px}
.f-id h1{font-size:clamp(26px,3.2vw,34px);font-weight:900;letter-spacing:-.04em;color:var(--ink);line-height:1.15}
.f-meta,.f-id p{color:#615a52;font-size:14.5px;font-weight:600;margin-top:6px;overflow-wrap:anywhere}
.f-id .pills{margin-top:10px;gap:6px}
.f-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.f-actions .btn{min-height:40px;padding:8px 18px;font-size:14px;font-weight:800;border-radius:12px}
.tabs-wrap{position:relative;margin:18px auto 22px;max-width:1040px}
.tabs-wrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:32px;background:linear-gradient(to right,transparent,var(--paper));pointer-events:none;opacity:.95}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 8px;background:rgba(220,212,202,.55);border:1px solid rgba(212,196,180,.6);border-radius:999px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid transparent;background:transparent;color:#534c45;font-weight:800;font-size:14.5px;padding:9px 18px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:all .15s ease}
.tab:hover{background:rgba(255,255,255,.65);color:var(--ink)}
.tab.on{background:var(--ink);color:#fff;font-weight:900;box-shadow:0 2px 10px rgba(43,43,43,.18)}
.tab i{font-style:normal;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:900;display:inline-grid;place-items:center}
.f-grid{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(0,1fr);gap:20px;align-items:start;max-width:1040px;margin:0 auto}
.f-side{display:grid;gap:18px}
.dirty{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:999px;background:var(--warnbg);color:var(--warn);font-weight:900;font-size:13.5px;border:1px solid #ead5b6}
.save-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;padding:16px 20px;border-radius:16px;background:linear-gradient(180deg,#f7f2ec 0%,#eee6dc 100%);border:1px solid #e2d7cb;box-shadow:0 1px 3px rgba(43,43,43,.03)}
.save-bar.clean{background:transparent;border:0;box-shadow:none;padding:8px 4px;color:var(--muted);font-size:13.5px}
.section-title{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#726a61;margin:2px 0 16px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:#eee8e1}

/* Resolver guiado */
.rs{background:#ffffff;border:1px solid rgba(212,196,180,.5);border-radius:22px;box-shadow:0 2px 4px rgba(43,43,43,.02),0 12px 32px rgba(43,43,43,.06);overflow:hidden;animation:rise .3s var(--ease);border-top:4px solid var(--sand2)}
.rs.bad{border-top-color:var(--bad)}.rs.warn{border-top-color:#c99a5b}.rs.vigia{border-top-color:var(--info)}
.rs+.rs{margin-top:18px}
.rs-head{padding:22px 24px 6px}
.rs-head .eyebrow{display:flex;align-items:center;gap:8px;color:#7f776d;font-size:12px}
.rs-head h2{font-size:22px;font-weight:900;margin-top:6px;letter-spacing:-.035em;color:var(--ink)}
.rs-head p{color:#5c554e;font-size:14.5px;margin-top:6px;line-height:1.45}
.rs-head .pills{margin-top:10px}
.rs-body{padding:18px 24px 6px;display:grid;gap:16px}
.rs-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 24px 22px}
.rs-snooze{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 24px;border-top:1px solid #f0e9e1;background:#faf7f3;font-size:13.5px;color:var(--muted)}
.rs-snooze b{font-weight:900;margin-right:2px}
.rs-err{margin:0 24px 12px;padding:10px 14px;border-radius:12px;background:var(--badbg);color:var(--bad);font-weight:900;font-size:13.5px}
.rs-err:empty{display:none}
.hint{padding:13px 15px;border-radius:13px;background:var(--sandsoft);color:#534b42;font-size:14.5px;line-height:1.45}
.hint.info{background:var(--infobg);color:#2f4e6b}
.hint.warn{background:var(--warnbg);color:#6b4b22}
.step-label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:12px;border:1px solid #ded6cc;background:var(--white);font-weight:900;font-size:14.5px;transition:all .12s}
.seg input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 2px 6px rgba(43,43,43,.15)}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qchip,.dchip{border:1px solid #ded5cb;background:var(--white);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:700;color:#4e4842;cursor:pointer;transition:all .12s}
.qchip:hover,.dchip:hover{border-color:var(--ink);color:var(--ink)}
.dchip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:900;box-shadow:0 2px 6px rgba(43,43,43,.18)}
.date-preview{font-size:13.5px;color:var(--muted);margin-top:6px}
.date-preview b{color:var(--ink)}
.rs .only-atualizei{display:grid;gap:12px}
.rs:has(input[data-rf="decisao"][value="IGUAL"]:checked) .only-atualizei{display:none}
.rs:has(input[data-rf="tipoPagamento"][value="RECORRENTE"]:checked) .only-manual{display:none}
.rs:has(input[data-rf="tipoPagamento"][value="MANUAL"]:checked) .only-recorrente{display:none}
.rs:has(input[data-rf="espera"][value="NINGUEM"]:checked) .only-espera{display:none}
details.more{border:1px solid #e7e0d7;border-radius:14px;background:#fcfaf7}
details.more>summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:900;font-size:14.5px;display:flex;align-items:center;gap:8px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:'+';margin-left:auto;font-size:18px;color:var(--muted)}
details.more[open]>summary::after{content:'-'}
details.more>div{padding:0 16px 16px;display:grid;gap:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.fact{background:#f8f5f1;border:1px solid #ece4dc;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;min-width:0;transition:border-color .15s,background .15s}
.fact:hover{background:#f5f1ec;border-color:#dfd6cb}
.fact span{display:block;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#726a61;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fact b{display:block;font-size:18px;font-weight:900;letter-spacing:-.02em;color:var(--ink);margin-top:3px;line-height:1.2}
.fact small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.fact small.down{color:var(--ok);font-weight:900}.fact small.up{color:var(--warn);font-weight:900}

/* WhatsApp */
.wa-box{border:1px solid #c2decc;background:linear-gradient(180deg,#f7fcf9 0%,#eef8f2 100%);border-radius:16px;padding:16px 18px;box-shadow:0 1px 3px rgba(31,138,76,.05)}
.wa-box>b{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#1a5732;margin-bottom:10px}
.wa-box textarea{min-height:84px;background:#ffffff;border:1px solid #b7d8c3;border-radius:12px;padding:11px 13px;font-size:14.5px;line-height:1.5;color:#1b2620}
.wa-box textarea:focus{border-color:#1e7e45;box-shadow:0 0 0 3px rgba(30,126,69,.18)}
.wa-foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.wa-foot small{color:#557261;font-size:12.5px}
.wa-none{display:flex;align-items:center;gap:9px;font-size:14px;color:#706961;padding:13px 15px;border-radius:14px;background:#f7f3ee;border:1px solid #ece4dc}

/* Resultado (depois de resolver) */
.win{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(140deg,#35503f,#2c4236);color:#fff;border-radius:22px;padding:20px 22px;box-shadow:var(--sh2);margin-bottom:16px;animation:rise .3s var(--ease)}
.win .done-mark{width:44px;height:44px}
.win>div{flex:1;min-width:0}
.win b{display:block;font-size:17.5px;font-weight:900}
.win p{color:#d7e8dc;font-size:14.5px;margin-top:3px}
.win-next{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16)}
.win-next span{flex:1;min-width:180px;font-size:14.5px;color:#e6f0e9}
.win .btn{background:#fff;color:var(--ink);border-color:#fff}
.win .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}

/* Em dia */
.calm{display:flex;gap:16px;align-items:center;background:linear-gradient(180deg,#eff6f1 0%,#e6f1e9 100%);border:1px solid #cfe0d4;border-radius:22px;padding:22px 24px;box-shadow:0 1px 3px rgba(39,68,47,.03)}
.calm .done-mark{width:46px;height:46px;border-radius:14px;background:#ffffff;display:grid;place-items:center;box-shadow:0 2px 6px rgba(39,68,47,.08)}
.calm .done-mark .ic{color:var(--ok);width:24px;height:24px}
.calm b{display:block;font-size:18px;font-weight:900;color:#233e2a}
.calm p{color:#44634e;font-size:14px;margin-top:4px}

/* Ciclo (checkpoints) */
.cp{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:11px 8px;border-bottom:1px solid #f1ece6;cursor:pointer;border-radius:10px;transition:background .12s}
.cp:last-child{border-bottom:0}.cp:hover{background:var(--sandsoft)}
.cp i{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:0 0 auto;box-shadow:0 0 0 2px rgba(63,107,82,.15)}
.cp.warn i{background:#b8863f;box-shadow:0 0 0 2px rgba(184,134,63,.15)}.cp.bad i{background:var(--bad);box-shadow:0 0 0 2px rgba(161,70,63,.15)}.cp.none i{background:transparent;border:2px dashed #c4bcbf;box-shadow:none}
.cp .grow{flex:1;min-width:0;font-weight:800;font-size:14.5px;color:var(--ink)}
.cp em{font-style:normal;text-align:right;font-size:13.5px;font-weight:900;white-space:nowrap}
.cp em small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.cp.bad em{color:var(--bad)}.cp.none em{color:var(--muted)}
.ob-bar{height:8px;border-radius:99px;background:#eee7e0;overflow:hidden;margin:8px 0 12px}.ob-bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.ob-step{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14.5px}
.ob-step .tick{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);flex:0 0 auto}
.ob-step.done{color:var(--muted)}.ob-step.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.ob-step.done .tick .ic{width:12px;height:12px;stroke-width:3}
.ob-step.atual{font-weight:900}.ob-step.atual .tick{border-color:var(--ink)}
.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.links .btn.soft{background:#f7f3ee;border:1px solid #e8e1d8;border-radius:12px;font-weight:800;font-size:13.5px;transition:all .12s}
.links .btn.soft:hover{background:#ede6dc;border-color:#ded5c9}

/* Timeline, exercícios, pagamentos */
.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:#eae2d7;border-radius:2px}
.tl-item{position:relative;padding:0 0 18px 12px}
.tl-item::before{content:'';position:absolute;left:-19px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--sand);border:2px solid #fff;box-shadow:0 0 0 2px rgba(212,196,180,.7)}
.tl-item.comm::before{background:var(--wa);box-shadow:0 0 0 2px rgba(31,138,76,.3)}
.tl-item.pay::before{background:var(--info);box-shadow:0 0 0 2px rgba(53,89,125,.3)}
.tl-item b{display:block;font-size:14.5px;font-weight:900;color:var(--ink)}
.tl-item small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tl-item p{font-size:14px;color:#453e37;margin-top:4px;white-space:pre-wrap;background:#fbf9f6;border:1px solid #eee7de;border-radius:10px;padding:9px 12px}
.table-wrap{overflow-x:auto;border:1px solid #ebe4dc;border-radius:14px;background:var(--white);box-shadow:0 1px 3px rgba(43,43,43,.02)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #f2ede7;white-space:nowrap}
th{font-size:11.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#726b62;background:#f8f4ee}
tr:last-child td{border-bottom:0}
tr:hover td{background:#faf7f3}
.switch-row{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 0;border-top:1px solid #f1ece5}
.switch-row:first-of-type{border-top:0}
.switch-row div{flex:1;min-width:0}.switch-row b{display:block;font-size:14.5px;font-weight:800;color:var(--ink)}.switch-row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.switch{position:relative;width:48px;height:28px;border-radius:99px;border:0;background:#d8d0c7;cursor:pointer;flex:0 0 auto;transition:background .18s ease}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .18s var(--ease)}
.switch.on{background:var(--ok)}.switch.on::after{transform:translateX(20px)}
.spark{display:block;width:100%;height:64px}
.danger-zone{border-color:#eccac4;background:linear-gradient(180deg,#ffffff 0%,#fffbfb 100%)}
.ficha-save-bar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:14px;background:#232220;color:#fff;padding:10px 20px;border-radius:999px;box-shadow:0 10px 32px rgba(25,23,21,.32),0 2px 6px rgba(25,23,21,.12);border:1px solid rgba(255,255,255,.1);animation:rise .22s var(--ease)}
.ficha-save-bar span{font-size:14px;font-weight:700;color:var(--sand)}
.ficha-save-bar .btn{padding:8px 18px;font-size:13.5px;border-radius:999px}
.ai-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#f0e6dd 0%,#d4c4b4 100%);color:var(--ink);padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:900;letter-spacing:.06em;box-shadow:0 1px 3px rgba(43,43,43,.06)}
.ai-master{padding:14px 16px;border:1px solid #e6ddd4;border-radius:16px;background:linear-gradient(180deg,#fbf8f5 0%,#f7f2ed 100%)}
.ai-cycle{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.ai-areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.ai-area{border:1px solid #e7e0d8;border-radius:16px;background:#fff;padding:14px}
.ai-area-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.ai-area-head b{font-size:15px;font-weight:900}.ai-area-head small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ai-perms{margin-top:8px;border-top:1px solid #f0ebe5}
.ai-perms .switch-row{padding:10px 0}.ai-perms .switch-row b{font-size:13.5px}.ai-perms .switch-row small{font-size:12px}
.ai-quota{margin-top:10px;padding-top:10px;border-top:1px solid #f0ebe5}
.ai-presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.ai-expired{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--badbg);color:var(--bad);font-size:12.5px;font-weight:800}

/* Adicionar */
.member{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #efe9e3}
.member:last-child{border-bottom:0}
.member>div{flex:1;min-width:0}.member b{display:block;font-size:15px}.member small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.member>.fld{margin:0}.member>.fld span{font-size:11px}.member>.fld input{min-height:38px;padding:7px 10px;font-size:13px}
.archive-confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--warnbg);border:1px solid #ead5b6}
.archive-confirm>div{flex:1 1 260px;min-width:0}.archive-confirm strong{display:block}.archive-confirm small{display:block;color:#7a5a30;margin-top:2px}

/* Toasts (topo: é a parte do iframe que está sempre à vista ao abrir uma vista) */
.toasts{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:120;display:grid;gap:8px;width:min(460px,calc(100vw - 24px));pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:14px;padding:11px 14px;box-shadow:var(--sh3);animation:rise .25s var(--ease);font-size:14px;font-weight:700;pointer-events:auto}
.toast.error{background:#6e2f2a}.toast.ok .ic{color:#9fd3ae}

/* Modal de Exportação PDF Oficial DIASFIT */
.pdf-modal-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(25,23,21,.65);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding:clamp(20px,4vh,56px) 16px 24px;overflow-y:auto;animation:fadeIn .2s var(--ease)}
.pdf-modal-card{background:var(--card-bg,#fff);border:1px solid var(--border,#e2d9cf);border-radius:18px;max-width:460px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.28);padding:28px 24px 22px;text-align:center}
.pdf-modal-icon{width:52px;height:52px;border-radius:50%;background:#F1E9E0;color:#2B2B2B;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px}
.pdf-modal-icon .ic{width:26px;height:26px}
.pdf-modal-card h3{font-size:19px;color:#2B2B2B;margin:4px 0 8px;font-weight:700}
.pdf-modal-card p{color:var(--text-muted,#777);font-size:14px;line-height:1.45;margin-bottom:20px}
.pdf-modal-actions{display:grid;gap:10px}

/* Responsividade */
@media(min-width:641px){
  details.q-fold-seguintes>summary,details.ag-fold>summary{display:none}
  details.q-fold-seguintes,details.ag-fold{border-top:0;padding-top:0;margin-top:0}
}
@media(max-width:980px){.f-grid{grid-template-columns:minmax(0,1fr)}}
@media(min-width:768px) and (max-width:980px){
  .dash{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px}
}
@media(max-width:767px){
  .ai-areas,.ai-cycle{grid-template-columns:1fr}
  .member{display:grid;grid-template-columns:32px minmax(0,1fr);gap:7px 8px;padding:10px 2px;align-items:center}
  .member>.av{grid-column:1;grid-row:1}
  .member>div{grid-column:2;grid-row:1}
  .member>.fld{grid-column:1/-1;width:100%!important;max-width:none!important}
  .member>.btn{grid-column:1/-1;width:100%;min-height:36px}
  .member .pills{gap:4px}
  .archive-confirm{display:grid;grid-template-columns:1fr 1fr;padding:10px;gap:8px}
  .archive-confirm>div{grid-column:1/-1}.archive-confirm .btn{width:100%}

  /* Tipografia base e espacamento geral */
  body{font-size:11.5px}
  .app{padding:6px 8px 20px}
  
  /* Topo ultra-compacto */
  .top{margin-bottom:6px;gap:4px;align-items:flex-start}
  .top .eyebrow{font-size:8.5px;line-height:1;letter-spacing:.05em}
  .top h1{font-size:25px;margin-top:1px;letter-spacing:-.03em;line-height:1.1}
  .status{margin-top:1px;font-size:9.5px;gap:5px}
  .status .dot{width:6px;height:6px}
  .top-actions{width:100%;display:flex;gap:6px;flex-wrap:nowrap;margin-top:4px}
  .top-actions .btn{flex:1 1 0;height:36px;min-height:36px;padding:4px 6px;font-size:11px;border-radius:8px}
  .top-actions .btn .ic{width:13px;height:13px}

  /* Faixa novo atleta (linha unica horizontal sem corte) */
  .banner{box-sizing:border-box!important;width:100%!important;max-width:100%!important;overflow:hidden!important;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:space-between!important;flex-wrap:nowrap!important;padding:5px 8px!important;gap:6px!important;height:44px!important;min-height:44px!important;border-radius:10px!important;margin-bottom:8px!important}
  .banner>div{min-width:0!important;flex:1 1 auto!important;display:flex!important;align-items:center!important;gap:6px!important;overflow:hidden!important}
  .banner .done-mark{width:22px!important;height:22px!important;border-radius:6px!important;flex-shrink:0!important}
  .banner .done-mark .ic{width:12px!important;height:12px!important}
  .banner strong{font-size:11.5px!important;line-height:1.2!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;display:block!important}
  .banner small{display:none!important}
  .banner .btn.sm{flex-shrink:0!important;padding:4px 8px!important;font-size:11px!important;height:32px!important;min-height:32px!important;border-radius:7px!important;white-space:nowrap!important}
  .banner .btn.sm .ic{width:12px!important;height:12px!important}

/* ============================== Datas (sempre em Lisboa) ============================== */

/* ============================== Ponte Wix (protocolo V4, igual à versão anterior) ============================== */
const pending = new Map();
const pendingUi = new Map();
let seq = 0;
function parentOriginFromReferrer() { try { return document.referrer ? new URL(document.referrer).origin : null; } catch (_) { return null; } }
function sendRaw(message, initial = false) {

}
function newRequestId(action) {

}
function call(action, payload = {}, timeout = 30000) {
  if (!S.channelId) return Promise.reject(new Error('A ligação ao Wix ainda não está pronta.'));
  const id = newRequestId(action);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { pending.delete(id); reject(new Error('A operação demorou demasiado. Tenta novamente.')); }, timeout);
    pending.set(id, { resolve, reject, timer });
    sendRaw({ type: 'diasfit-command', channelId: S.channelId, requestId: id, action, payload: { ...payload, requestId: id } });
  });
}
function uiRequest(type, payload = {}, timeout = 1200) {
  if (!S.channelId) return Promise.resolve(null);
  const id = newRequestId(type);
  return new Promise(resolve => {
    const timer = setTimeout(() => { pendingUi.delete(id); resolve(null); }, timeout);
    pendingUi.set(id, { resolve, timer });

let heightTimer = null;
function sendHeight() {
  if (!S.channelId) return;

  // de uma vista longa para uma curta, sem ciclo de realimentação com o iframe.
  heightTimer = setTimeout(() => {
    const h = Math.ceil(($('#app').getBoundingClientRect().height || 0) + 8);
    sendRaw({ type: 'wix-height', channelId: S.channelId, height: h });
  }, 80);
}
function irParaTopo() {

}
function onMessage(event) {
  if (event.source !== window.parent || !event.data || typeof event.data !== 'object') return;
  const m = event.data;
  if (m.type === 'diasfit-auth-denied') {
    // Resposta segura da página Wix. Sem channelId e sem operações de CMS.
    // Permite perceber uma falha de sessão/Preview sem a confundir com rede.
    if (!S.connected) {
      S.erroDash = String(m.reason || 'Acesso de administrador não confirmado.').slice(0, 350);
      render();
    }
    return;
  }
  if (m.type === 'diasfit-init') {
    const novo = String(m.channelId || '');
    if (!novo) return;
    S.channelId = novo; S.parentOrigin = event.origin; S.connected = true;
    carregarPainel().then(() => {
      if (!m.abrirFicha) return;
      const a = todosAtletas().find(x => x.membroId === m.abrirFicha || x.membroID === m.abrirFicha || x._id === m.abrirFicha);
      if (a) abrirFicha(a._id);
    });
    sendHeight();
    return;
  }
  if (m.channelId === S.channelId && ['diasfit-overlay-ready', 'diasfit-overlay-closed', 'diasfit-scroll-complete'].includes(m.type)) {
    const p = pendingUi.get(m.requestId);
    if (p) { clearTimeout(p.timer); pendingUi.delete(m.requestId); p.resolve(m); }
    return;
  }
  if (m.type !== 'diasfit-response' || m.channelId !== S.channelId) return;

  if (!p) return;
  clearTimeout(p.timer); pending.delete(m.requestId);

let painelEmCurso = null;

  S.loadingDash = true;
  if (!silencioso && S.view === 'painel') render();

      S.erroDash = e.message || 'Não foi possível carregar o painel.';

    if (!silencioso || !S.dash) render();
  }
}

/* ---------- Agenda ---------- */
function agendaItens(dias = 7) {
  const hoje = todayNum(), fim = hoje + dias - 1, out = [];
  const add = (a, v, label, icon, { hora = false, tab = 'ACOMPANHAR' } = {}) => {
    const n = dayNum(v); if (n === null || n < hoje || n > fim) return;
    out.push({ atleta: a, data: v, n, label, icon, hora, tab });
  };
  for (const a of ativos()) {
    add(a, a.proximaDataTreino, 'Revisão de treino', 'dumbbell', { tab: 'TREINO' });
    add(a, a.proximaDataNutricao, 'Revisão de nutrição', 'food', { tab: 'NUTRICAO' });
    add(a, a.proximaAvaliacao, 'Avaliação', 'scale', { tab: 'AVALIACAO' });
    for (const k of ['dataVideochamada', 'dataVideochamada2', 'dataVideochamada3']) if (toDate(a[k]) && toDate(a[k]) >= new Date()) add(a, a[k], 'Videochamada', 'video', { hora: true, tab: 'AVALIACAO' });
    add(a, a.dataAvaliacaoFisica, 'Avaliação física', 'scale', { hora: true, tab: 'AVALIACAO' });
    add(a, a.ptProximoTreino, 'PT presencial', 'dumbbell', { hora: true, tab: 'TREINO' });
    if (a.packFimFixo && a.exigirPack !== false) add(a, a.dataFimPackCalculada, 'Fim do pack', 'box', { tab: 'DADOS' });
    if (a.notificarPagamentos !== false) add(a, a.dataProximoPagamento, 'Pagamento', 'euro', { tab: 'PAGAMENTOS' });
  }
  return out.sort((x, y) => x.n - y.n || (toDate(x.data) - toDate(y.data)));
}
function htmlAgenda() {
  const itens = agendaItens(7);
  const hoje = todayNum();
  const diasIniciais = [];
  const diasRestantes = [];
  let contagem = 0;
  for (let n = hoje; n < hoje + 7; n++) {
    const l = itens.filter(i => i.n === n);
    if (!l.length) continue;
    const nome = n === hoje ? 'Hoje' : n === hoje + 1 ? 'Amanhã' : `${WD_LONG[weekdayOfNum(n)]} ${fmtDate(isoFromNum(n))}`;
    const bloco = `<div class="ag-day ${n === hoje ? 'today' : ''}"><b>${esc(nome)}</b>${l.map(i => `<button type="button" class="ag-item" data-act="abrir" data-atleta="${esc(i.atleta._id)}" data-tab="${i.tab}">${ic(i.icon)}<span>${esc(nomeDe(i.atleta))} · ${esc(i.label)}</span>${i.hora ? `<em>${esc(parts(i.data).hour)}:${esc(parts(i.data).minute)}</em>` : ''}</button>`).join('')}</div>`;
    if (contagem < 4 || !diasIniciais.length) {
      diasIniciais.push(bloco);
      contagem += l.length;
    } else {
      diasRestantes.push(bloco);
    }
  }
    const isDesktop = typeof window !== 'undefined' && window.innerWidth > 767;
    return `<section class="card">
      <div class="card-head"><div><div class="eyebrow">Próximos 7 dias</div><h3>${itens.length ? plural(itens.length, 'compromisso', 'compromissos') : 'Semana tranquila'}</h3></div></div>
      ${diasIniciais.length ? diasIniciais.join('') : `<div class="empty" style="padding:10px">Nenhuma revisão, avaliação ou chamada marcada para esta semana.</div>`}
      ${diasRestantes.length ? `<details class="fold ag-fold"${isDesktop ? ' open' : ''}><summary style="font-size:13px;padding:6px 0;color:var(--ink);cursor:pointer">Ver todos os compromissos (${itens.length})</summary>${diasRestantes.join('')}</details>` : ''}
    </section>`;
}

function htmlEstadoAtleta(a) {

function htmlBadgePt(a) {

  const saldo = m?.restantes ?? (a.ptSaldo !== undefined && a.ptSaldo !== null && a.ptSaldo !== '' && Number.isFinite(Number(a.ptSaldo)) ? Math.max(0, Number(a.ptSaldo)) : null);
  const totais = m?.contratadas ?? (a.ptTreinosTotais !== undefined && a.ptTreinosTotais !== null && a.ptTreinosTotais !== '' && Number.isFinite(Number(a.ptTreinosTotais)) ? Math.max(0, Number(a.ptTreinosTotais)) : (feitas !== null && saldo !== null ? feitas + saldo : null));
  if (feitas === null && saldo === null && totais === null) return '';

  if (!partes.length) return '';
  return `<span class="pill ${saldo === 0 ? 'warn' : 'ok'}" title="Sessões de treino presencial">${ic('dumbbell')} PT: ${esc(partes.join(' · '))}</span>`;
}
function htmlUltimaAcao(a) {

function htmlListaAtletas() {

function htmlAtletas() {

async function abrirFicha(id, { tab = 'ACOMPANHAR', taskId = null } = {}) {
  if (!id) return;
  if (S.view === 'ficha' && S.fichaId === id) { S.tab = tab; S.foco = taskId; S.resultado = null; render(); irParaTopo(); return; }
  if (S.view === 'ficha' && temAlteracoes()) { S.saidaPendente = { tipo: 'ficha', id, tab, taskId }; render(); irParaTopo(); return; }
  Object.assign(S, { view: 'ficha', fichaId: id, detalhe: null, tab, foco: taskId, resultado: null, exercicios: null, saidaPendente: null, confirmarInativar: false, original: {}, draft: {}, mostrarFormTreino: false });
  render(); irParaTopo();
  try {
    await recarregarDetalhe();
  } catch (e) {
    toast(e.message, 'error');
    S.view = 'painel'; render();
    return;
  }
  render();
}
async function recarregarDetalhe() {
  const id = S.fichaId;
  const d = await call('detalhe', { atletaRegistoId: id }, 45000);
  if (S.fichaId !== id) return;
  S.detalhe = d;
  prepararOriginal();
}
function prepararOriginal() {
  const a = S.detalhe?.atleta || {};
  S.original = {};
  for (const [k, , tipo] of TODOS_CAMPOS()) S.original[k] = paraInput(a[k], tipo);
  S.draft = { ...S.original };

  const perfil = S.detalhe?.perfil || {};
  S.perfilOriginal = {};
  for (const [k, , tipo] of PERFIL_FIELDS) S.perfilOriginal[k] = paraInput(perfil[k], tipo);
  // A frequência não é editada em separado: é derivada dos dias sempre que existem.
  S.perfilOriginal.treinosPorSemana = perfil.treinosPorSemana == null ? '' : String(perfil.treinosPorSemana);
  S.perfilDraft = { ...S.perfilOriginal };
  S.perfilDiasOriginal = Array.isArray(perfil.diasDeTreino) ? [...perfil.diasDeTreino] : [];
  S.perfilDiasDraft = [...S.perfilDiasOriginal];
}
function paraInput(v, tipo) {
  if (tipo === 'date') return inputDate(v);
  if (tipo === 'datetime-local') return inputDateTime(v);
  return v === null || v === undefined ? '' : String(v);
}
function alteracoes() {
  const out = {};
  for (const [k, v] of Object.entries(S.draft)) if (String(v ?? '') !== String(S.original[k] ?? '')) out[k] = v;
  return out;
}
function alteracoesPerfil() {
  const out = {};
  for (const [k, v] of Object.entries(S.perfilDraft || {})) {
    if (String(v ?? '') !== String(S.perfilOriginal?.[k] ?? '')) out[k] = v;
  }
  const a = JSON.stringify([...(S.perfilDiasDraft || [])].sort());
  const b = JSON.stringify([...(S.perfilDiasOriginal || [])].sort());
  if (a !== b) {
    out.diasDeTreino = [...(S.perfilDiasDraft || [])];
    out.treinosPorSemana = (S.perfilDiasDraft || []).length;
  }
  return out;
}
const temAlteracoesPerfil = () => Object.keys(alteracoesPerfil()).length > 0;
const temAlteracoes = () => Object.keys(alteracoes()).length > 0 || temAlteracoesPerfil();
async function guardarDraft(btn) {
  const ch = alteracoes();
  const chPerfil = alteracoesPerfil();
  const total = Object.keys(ch).length + Object.keys(chPerfil).length;
  if (!total) return true;
  busy(btn, true, 'A guardar…');
  try {
    if (Object.keys(ch).length) {
      await call('guardar', { atletaRegistoId: S.fichaId, alteracoes: ch }, 45000);
    }
    if (Object.keys(chPerfil).length) {
      await call('guardarPerfil', { atletaRegistoId: S.fichaId, alteracoes: chPerfil }, 45000);
    }
    await Promise.all([recarregarDetalhe(), carregarPainel(true)]);
    toast(`${plural(total, 'alteração guardada', 'alterações guardadas')}.`);
    return true;
  } catch (e) { toast(e.message, 'error'); return false; }
  finally { busy(btn, false); }
}
function voltarPainel() {
  if (temAlteracoes()) { S.saidaPendente = { tipo: 'painel' }; render(); irParaTopo(); return; }
  Object.assign(S, { view: 'painel', fichaId: null, detalhe: null, resultado: null, foco: null, saidaPendente: null });
  render(); irParaTopo();
}
function seguirSaida() {
  const s = S.saidaPendente; S.saidaPendente = null;
  S.draft = { ...S.original };
  S.perfilDraft = { ...S.perfilOriginal };
  S.perfilDiasDraft = [...S.perfilDiasOriginal];
  if (!s || s.tipo === 'painel') { Object.assign(S, { view: 'painel', fichaId: null, detalhe: null, resultado: null, foco: null }); render(); irParaTopo(); return; }
  S.view = 'painel';
  abrirFicha(s.id, { tab: s.tab, taskId: s.taskId });
}

/* Checkpoints do ciclo: tudo o que tem data, do mais próximo para o mais distante. */
function checkpoints(a) {
  const out = [];
  const push = (key, label, v, tab, { hora = false } = {}) => out.push({ key, label, v: v || null, n: v ? dayNum(v) : null, tab, hora });
  const faltas = new Set((a._dadosEmFalta || []).map(f => `${f.area}:${f.codigo}`));
  const gereTreino = a.packEscolhido && !['Plano alimentar', 'DIETA DIASFIT'].includes(String(a.packEscolhido).split('|')[0]);
  if (gereTreino || a.proximaDataTreino) push('treino', 'Revisão de treino', a.proximaDataTreino, 'TREINO');
  if (a.proximaDataNutricao || faltas.has('NUTRICAO:CONFIGURAR') || faltas.has('NUTRICAO:PROXIMA_DATA') || a.faseNutricao) push('nutricao', 'Revisão de nutrição', a.proximaDataNutricao, 'NUTRICAO');
  if (a.proximaAvaliacao || a.tipoAvaliacao || faltas.has('AVALIACAO:CONFIGURAR')) push('avaliacao', 'Avaliação', a.proximaAvaliacao, 'AVALIACAO');
  if (a.proximaVideochamada) push('video', 'Videochamada', a.proximaVideochamada, 'AVALIACAO', { hora: true });
  if (a.dataAvaliacaoFisica && dayNum(a.dataAvaliacaoFisica) >= todayNum() - 7) push('fisica', 'Avaliação física', a.dataAvaliacaoFisica, 'AVALIACAO', { hora: true });
  if (a.ptProximoTreino) push('pt', 'PT presencial', a.ptProximoTreino, 'TREINO', { hora: true });
  if (a.packFimFixo && a.exigirPack !== false) push('pack', 'Fim do pack', a.dataFimPackCalculada, 'DADOS');
  if (a.notificarPagamentos !== false && (a.dataProximoPagamento || a.tipoPagamento)) push('pagamento', 'Pagamento', a.dataProximoPagamento, 'PAGAMENTOS');
  return out.sort((x, y) => (x.n ?? 1e9) - (y.n ?? 1e9));
}

/* ---------- Avaliação ---------- */
function htmlSparkline(lista) {
  const pts = lista.filter(x => x.peso !== null && x.peso !== undefined && x.peso !== '' && Number.isFinite(Number(x.peso))).slice(0, 12).reverse();
  if (pts.length < 2) return '';
  const vals = pts.map(p => Number(p.peso)); const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const W = 300, H = 64, pad = 6;
  const xy = vals.map((v, i) => [pad + (i * (W - 2 * pad)) / (vals.length - 1), pad + (H - 2 * pad) * (1 - (v - min) / span)]);
  const d = xy.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const delta = vals[vals.length - 1] - vals[0];
  return `<div class="facts" style="margin-bottom:8px"><div class="fact"><span>Atual</span><b>${vals[vals.length - 1]} kg</b></div><div class="fact"><span>Desde ${esc(fmtDate(pts[0].data || pts[0].criadaEm))}</span><b>${delta > 0 ? '+' : ''}${delta.toFixed(1)} kg</b></div></div>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolução do peso"><path d="${d}" fill="none" stroke="#3f6b52" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>${xy.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="#3f6b52"/>`).join('')}</svg>`;
}

/* ============================== Resolver guiado ==============================

const CICLO = {
  TREINO: { nome: 'treino', reaj: 'dataReajusteTreino', prox: 'proximaDataTreino', notif: 'treino', link: 'treino', linkLabel: 'Abrir plano de treino', chips: [['+2 semanas', 14], ['+3 semanas', 21], ['+4 semanas', 28], ['+6 semanas', 42]], padrao: 28, msg: 'treino' },
  NUTRICAO: { nome: 'nutrição', reaj: 'dataReajusteNutricao', prox: 'proximaDataNutricao', notif: 'nutricao', link: 'nutricao', linkLabel: 'Abrir plano alimentar', chips: [['+1 semana', 7], ['+2 semanas', 14], ['+3 semanas', 21], ['+4 semanas', 28]], padrao: 14, msg: 'nutricao' }
};
const CHIPS_AVAL = [['+1 semana', 7], ['+2 semanas', 14], ['+4 semanas', 28]];

/* ---------- Peças de formulário ---------- */

}
const fDataHora = (nome, label, valor) => `<label class="fld"><span>${esc(label)}</span><input type="datetime-local" data-rf="${nome}" value="${esc(valor)}"></label>`;
const fTexto = (nome, label, valor = '', ph = '') => `<label class="fld"><span>${esc(label)}</span><input data-rf="${nome}" value="${esc(valor)}" placeholder="${esc(ph)}"></label>`;
const fNumero = (nome, label, valor = '') => `<label class="fld"><span>${esc(label)}</span><input type="number" inputmode="decimal" step="any" data-rf="${nome}" value="${esc(valor)}"></label>`;
const fSelect = (nome, label, opcoes, valor = '') => `<label class="fld"><span>${esc(label)}</span><select data-rf="${nome}">${opcoes.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${v === valor ? 'selected' : ''}>${esc(l)}</option>`; }).join('')}</select></label>`;
const fCheck = (nome, label, on = true, ajuda = '') => `<label class="check"><input type="checkbox" data-rf="${nome}" ${on ? 'checked' : ''}><span>${esc(label)}${ajuda ? `<small>${esc(ajuda)}</small>` : ''}</span></label>`;
const fSeg = (nome, label, opcoes, valor) => { const grupo = `rs-${nome}-${Math.random().toString(36).slice(2, 7)}`; return `<div>${label ? `<div class="step-label">${esc(label)}</div>` : ''}<div class="seg" role="radiogroup">${opcoes.map(([v, l]) => `<label><input type="radio" name="${grupo}" data-rf="${nome}" value="${esc(v)}" ${v === valor ? 'checked' : ''}><span>${esc(l)}</span></label>`).join('')}</div></div>`; };
const fPack = (nome, label, valor) => `<label class="fld"><span>${esc(label)}</span><input data-rf="${nome}" list="rsPacks" value="${esc(valor)}" autocomplete="off"><datalist id="rsPacks">${packsCatalogo().map(p => `<option value="${esc(p)}">`).join('')}</datalist></label>`;

const linkBtn = (href, label, icon = 'external') => href ? `<a class="btn soft sm" href="${esc(href)}" target="_blank" rel="noopener noreferrer" style="justify-self:start">${esc(label)} ${ic(icon)}</a>` : '';
const hint = (txt, cls = '') => `<div class="hint ${cls}">${txt}</div>`;
const fComunicacao = (esperaPadrao = 'ATLETA', resumo = '') => `<div class="form-grid">${fSelect('canal', 'Canal', CANAIS, 'WHATSAPP')}<div class="fld"><span>E agora?</span><div class="seg"><label><input type="radio" name="rs-esp" data-rf="espera" value="ATLETA" ${esperaPadrao === 'ATLETA' ? 'checked' : ''}><span>Espero resposta</span></label><label><input type="radio" name="rs-esp" data-rf="espera" value="NINGUEM" ${esperaPadrao === 'NINGUEM' ? 'checked' : ''}><span>Assunto fechado</span></label></div></div><label class="fld span-all"><span>Resumo (opcional)</span><input data-rf="resumo" value="${esc(resumo)}" placeholder="O que ficou combinado?"></label></div>`;
function semanasPeriodicidade(p) {
  const s = String(p || '').trim().toLowerCase();
  if (s.includes('quinzenal')) return 2;
  if (s.includes('mensal') || s.includes('4 semana') || s.includes('4 sem')) return 4;
  return 1;
}

const proxAvaliacaoPadrao = a => {
  const atual = inputDate(a.proximaAvaliacao);
  if (atual && dayNum(atual) > todayNum()) return atual;
  const sem = semanasPeriodicidade(a.periodicidadeAvaliacao);
  const diaBase = proximoDiaSemana(a.diaSemanaAvaliacao);
  if (diaBase) {
    return sem > 1 ? addDaysISO(diaBase, (sem - 1) * 7) : diaBase;
  }
  return addDaysISO(todayISO(), sem * 7);
};

const chipsAval = a => {
  const sem = semanasPeriodicidade(a.periodicidadeAvaliacao);
  const diaBase = proximoDiaSemana(a.diaSemanaAvaliacao);
  const d = diaBase ? (sem > 1 ? addDaysISO(diaBase, (sem - 1) * 7) : diaBase) : null;
  const label = sem === 2 ? 'Próx. quinzena' : sem === 4 ? 'A cada 4 semanas' : 'Próx. semana';
  return d ? [[`${label} (${WD_LONG[weekdayOfNum(dayNum(d))].toLowerCase()})`, dayNum(d) - todayNum()], ...CHIPS_AVAL] : CHIPS_AVAL;
};
const idAvaliacao = (a, iso) => `derived:${a._id}:AVALIACAO:${iso}`;
function fMetodoEDiaAvaliacao(a) {
  const metodoAtual = a?.tipoAvaliacao || 'Peso em jejum';

        <option value="Quinzenal" ${periodicidadeAtual === 'Quinzenal' ? 'selected' : ''}>Quinzenal</option>
        <option value="A cada 4 semanas" ${periodicidadeAtual === 'A cada 4 semanas' || periodicidadeAtual === 'Mensal' ? 'selected' : ''}>A cada 4 semanas</option>
      </select>
      <small style="color:var(--muted)">Frequência habitual de envio.</small>
    </label>
    <label class="fld">
      <span style="display:flex;align-items:center;gap:5px">${ic('calendar')} Dia habitual</span>
      <select data-rf="diaSemanaAvaliacao">
        <option value="">Por definir</option>
        ${DIA_SEMANA_OPCOES.map(d => `<option value="${esc(d)}" ${d === diaAtual ? 'selected' : ''}>${esc(d)}</option>`).join('')}
      </select>
      <small style="color:var(--muted)">Dia acordado para envio do check-in.</small>
    </label>
  </div>`;
}

// Guarda preferências de avaliação e data da próxima avaliação sem alterar o histórico de avaliações passadas.
async function marcarAvaliacao(x, data, avisar) {
  const patch = {};
  if (data) patch.proximaAvaliacao = data;
  const tipoAv = x.v('tipoAvaliacao');
  if (tipoAv && tipoAv !== x.a.tipoAvaliacao) patch.tipoAvaliacao = tipoAv;
  const periodAv = x.v('periodicidadeAvaliacao');
  if (periodAv !== undefined && periodAv !== x.a.periodicidadeAvaliacao) patch.periodicidadeAvaliacao = periodAv || null;
  const diaSem = x.v('diaSemanaAvaliacao');
  if (diaSem !== undefined && diaSem !== x.a.diaSemanaAvaliacao) patch.diaSemanaAvaliacao = diaSem || null;
  if (Object.keys(patch).length > 0) {
    await x.guardar(patch, (avisar && data) ? ['avaliacao'] : []);
  }
  if (data && avisar && dayNum(data) - todayNum() <= 7) await x.adiarId(idAvaliacao(x.a, data), data, 'Confirmar próxima avaliação').catch(() => {});
}
function slotVideo(a, alvo) {
  const keys = ['dataVideochamada', 'dataVideochamada2', 'dataVideochamada3'];
  const ms = toDate(alvo)?.getTime();
  return keys.find(k => ms && toDate(a[k])?.getTime() === ms) || keys.find(k => ms && Math.abs((toDate(a[k])?.getTime() || 0) - ms) < 60000) || 'dataVideochamada';
}

/* ---------- Qual playbook ---------- */
function chavePlaybook(t) {
  const tipo = String(t.tipo || '').toUpperCase(), m = t.metadata || {};
  if (m.configuracaoEmFalta) return `CFG_${m.area}_${m.codigo}`;
  if (tipo === 'CONTACTO_PROATIVO' || m.contactoProativo) return 'CONTACTO_PROATIVO';
  if (tipo === 'AVALIACAO_RECEBIDA') return 'AVAL_RECEBIDA';
  if (tipo === 'VIDEOCHAMADA') return m.confirmarDesfecho ? 'VIDEO_CONFIRMAR' : 'VIDEO_PREPARAR';
  if (tipo === 'TREINO' && m.ptPresencial) return 'PT_AGENDAR';
  if (t.derivada && (tipo === 'TREINO' || tipo === 'NUTRICAO')) return 'CICLO';
  if (t.derivada && tipo === 'AVALIACAO') return 'AVAL_CICLO';
  if (t.derivada && tipo === 'AVALIACAO_FISICA') return 'FISICA';
  if (tipo === 'PAGAMENTO') return String(t._id).includes('PAGAMENTO_EM_FALTA') ? 'PAG_FALTA' : 'PAG_CONFIRMAR';
  if (t.derivada && tipo === 'PACK') return 'PACK';
  if (tipo === 'COMUNICACAO') return m.aguardaAtleta ? 'COM_FOLLOWUP' : m.primeiroContacto ? 'COM_PRIMEIRO' : 'COM_GERAL';
  if (tipo === 'ACOMPANHAMENTO') return 'CHECKIN';
  if (tipo === 'DADOS' && m.semProximoPasso) return 'SEM_PROXIMO';
  return t.derivada ? 'GENERICO' : 'MANUAL';
}

/* ---------- Desenhar ---------- */
function htmlResolver(t, a) {
  const chave = chavePlaybook(t);
  const pb = PB[chave] || (t.derivada ? PB.GENERICO : PB.MANUAL);
  let corpo = '';
  try { corpo = pb.corpo(t, a); } catch (e) { corpo = hint(esc(t.proximaAcao || '')); }
  const botoes = pb.botoes(t, a).map(([k, label, cls]) => `<button type="button" class="btn ${cls}" data-act="rs" data-do="${k}">${cls === 'ok' ? ic('check') : ''}${esc(label)}</button>`).join('');
  const snooze = podeAdiar(t) ? `<div class="rs-snooze"><b>${ic('moon')} Agora não:</b><button type="button" class="qchip" data-act="rsAdiar" data-dias="1">Amanhã</button><button type="button" class="qchip" data-act="rsAdiar" data-dias="3">Daqui a 3 dias</button><button type="button" class="qchip" data-act="rsAdiar" data-dias="7">Próxima semana</button></div>` : '';
  const cls = t.bucket === 'AGORA' ? 'bad' : t.bucket === 'HOJE' || isCheckin(t) ? 'warn' : t.bucket === 'A_ACOMPANHAR' ? 'vigia' : '';
  return `<section class="rs ${cls}" data-task="${esc(t._id)}" data-pb="${esc(PB[chave] ? chave : t.derivada ? 'GENERICO' : 'MANUAL')}">
    <div class="rs-head"><div class="eyebrow">${ic(tipoInfo(t).icon)} ${esc(tipoInfo(t).label)} · próximo passo</div>
      <h2>${esc(t.title || tipoInfo(t).label)}</h2>
      ${RAZAO_CURTA(t) ? `<p>${esc(RAZAO_CURTA(t))}</p>` : ''}
      <div class="pills"><span class="pill ${tom(t)}">${ic('clock')} ${esc(quando(t))}</span>${t.estimativaMinutos ? `<span class="pill">~${t.estimativaMinutos} min</span>` : ''}</div>
    </div>
    <div class="rs-body">${corpo}</div>
    <div class="rs-err" role="alert"></div>
    <div class="rs-foot">${botoes}</div>
    ${snooze}
  </section>`;
}
function htmlResultado() {
  const r = S.resultado;
  const aqui = tarefasAcionaveisDe(S.fichaId).length;
  const seguinte = filaAcionavel().find(t => t.atletaRegistoId !== S.fichaId);
  const sa = seguinte ? atletaPorId(seguinte.atletaRegistoId) || seguinte : null;
  let proximo;
  if (aqui) proximo = `<span>Ainda há ${plural(aqui, 'passo', 'passos')} nesta ficha (está logo abaixo).</span>${seguinte ? `<button type="button" class="btn ghost sm" data-act="resolver" data-atleta="${esc(seguinte.atletaRegistoId)}" data-task="${esc(seguinte._id)}">Saltar para ${esc(primeiroNome(sa))} ${ic('arrow')}</button>` : ''}`;
  else if (seguinte) proximo = `<span>Seguinte: <b>${esc(nomeDe(sa))}</b>: ${esc(seguinte.title)}</span><button type="button" class="btn sm" data-act="resolver" data-atleta="${esc(seguinte.atletaRegistoId)}" data-task="${esc(seguinte._id)}">Seguinte ${ic('arrow')}</button>`;
  else proximo = `<span>Fila concluída. Todos os atletas estão tratados. 👏</span><button type="button" class="btn sm" data-act="voltar">Voltar ao painel</button>`;
  return `<div class="win" aria-live="polite"><div class="done-mark">${ic('check')}</div><div><b>Feito</b><p>${esc(r.msg)}</p><div class="win-next">${proximo}</div></div></div>`;
}

/* ---------- Executar ---------- */
function contexto(card, t, a) {
  const v = n => { const el = $(`[data-rf="${n}"]`, card); return el ? String(el.value || '').trim() : ''; };
  const futura = (d, msg = 'Escolhe uma data.') => { if (!d) throw new Error(msg); if (dayNum(d) <= todayNum()) throw new Error('A data tem de ser depois de hoje.'); return d; };
  const adiarId = async (id, quandoISO, title) => {
    if (!suportaAdiarAutomaticas() && String(id).startsWith('derived:')) return false;
    const alvo = quandoISO.length === 10 ? `${quandoISO}T08:00` : quandoISO;
    if (toDate(alvo) <= new Date()) return false;
    await call('adiarTarefa', { tarefaId: id, adiadaAte: alvo, title: title || t.title || '' });
    return true;
  };
  return {
    t, a, card, v, futura,
    exigir: (n, msg) => { const x = v(n); if (!x) throw new Error(msg); return x; },
    exigirFutura: (n, msg) => futura(v(n), msg),
    chk: n => !!$(`[data-rf="${n}"]`, card)?.checked,
    radio: n => $(`[data-rf="${n}"]:checked`, card)?.value || '',
    dias: () => new Set($$('.dchip.on', card).map(b => b.dataset.dia)),
    guardar: (alteracoes, notificacoes = [], extra = {}) => call('guardar', { atletaRegistoId: S.fichaId, alteracoes, notificacoes, ...extra }, 45000),
    guardarPerfil: (alteracoes) => call('guardarPerfil', { atletaRegistoId: S.fichaId, alteracoes }, 45000),
    notificar: key => call('notificar', { atletaRegistoId: S.fichaId, notifKey: key }, 45000),
    concluir: (extra = {}) => call('concluirTarefa', { tarefaId: t._id, ...extra }),
    comunicacao: ({ canal, espera, resumo, chaveIdempotencia } = {}) => {
      const esp = espera || $('[data-rf="espera"]:checked', card)?.value || 'ATLETA';
      return call('comunicacao', {
        atletaRegistoId: S.fichaId,
        canal: canal || v('canal') || 'WHATSAPP',
        aguardaQuem: esp,
        direcao: esp === 'TREINADOR' ? 'ATLETA_PARA_TREINADOR' : 'TREINADOR_PARA_ATLETA',
        resumo: [resumo, v('resumo')].filter(Boolean).join(': '),
        chaveIdempotencia: chaveIdempotencia || t.metadata?.chaveIdempotencia || null
      });
    },
    adiarId,
    adiar: quandoISO => adiarId(t._id, quandoISO, t.title),
    adiarDias: n => adiarId(t._id, addDaysISO(todayISO(), n), t.title)
  };
}
async function executarPlaybook(btn, nomeAcao) {
  const card = btn.closest('.rs'); if (!card) return;
  const t = tarefasDe(S.fichaId).find(x => x._id === card.dataset.task) || principalDe(S.fichaId);
  const a = atletaAtual();
  const pb = PB[card.dataset.pb];
  const fn = pb && pb[nomeAcao];
  if (!t || !fn) return;
  const err = $('.rs-err', card); err.textContent = '';
  $$('button', card).forEach(b => { b.disabled = true; });
  busy(btn, true, 'A tratar…');
  try {
    const chGestao = alteracoes();
    const chPerfil = alteracoesPerfil();
    if (Object.keys(chGestao).length) await call('guardar', { atletaRegistoId: S.fichaId, alteracoes: chGestao }, 45000);
    if (Object.keys(chPerfil).length) await call('guardarPerfil', { atletaRegistoId: S.fichaId, alteracoes: chPerfil }, 45000);
    const msg = await fn.call(pb, contexto(card, t, a));
    if (msg === null) return;
    await depoisDeResolver(msg);
  } catch (e) {
    busy(btn, false);
    $$('button', card).forEach(b => { b.disabled = false; });
    err.textContent = e.message || 'Não foi possível concluir.';
    err.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}
async function depoisDeResolver(msg) {
  S.resultado = { msg };
  S.foco = null;
  S.tab = 'ACOMPANHAR';
  await Promise.all([recarregarDetalhe().catch(() => {}), carregarPainel(true)]);
  if (!atletaPorId(S.fichaId)) { Object.assign(S, { view: 'painel', fichaId: null, detalhe: null }); toast(msg); render(); irParaTopo(); return; }
  render();
  irParaTopo();
}

function htmlAdicionar() {
  const membros = S.membros !== null ? S.membros : (S.dash?.membrosDisponiveis || null);
  const listaBase = membros || [];

  const getTipo = m => m.tipoRegisto || (m.recuperacao ? 'EX_ATLETA' : m.pagamentoPendente ? 'POR_CONFIRMAR' : 'NOVA_ADESAO');
  const countNovos = listaBase.filter(m => getTipo(m) === 'NOVA_ADESAO').length;
  const countAntigos = listaBase.filter(m => getTipo(m) === 'EX_ATLETA').length;
  const countPendentes = listaBase.filter(m => getTipo(m) === 'POR_CONFIRMAR').length;
  const countIncompletos = listaBase.filter(m => getTipo(m) === 'REGISTO_INCOMPLETO').length;
  const countTodos = listaBase.length;

  const filtro = S.filtroMembros || 'TODOS';
  let listaFiltrada = listaBase;
  if (filtro === 'NOVOS') {
    listaFiltrada = listaBase.filter(m => getTipo(m) === 'NOVA_ADESAO');
  } else if (filtro === 'ANTIGOS') {
    listaFiltrada = listaBase.filter(m => getTipo(m) === 'EX_ATLETA');
  } else if (filtro === 'PENDENTES') {
    listaFiltrada = listaBase.filter(m => getTipo(m) === 'POR_CONFIRMAR');
  } else if (filtro === 'INCOMPLETOS') {
    listaFiltrada = listaBase.filter(m => getTipo(m) === 'REGISTO_INCOMPLETO');
  }

  const q = semAcento(S.pesquisaMembros.trim());
  const lista = listaFiltrada.filter(m => !q || [m.nomeCliente, m.emailCliente, m.packEscolhido, m.descricaoOrigem, m.motivoTriage, m.tipoDescricao].some(v => semAcento(v).includes(q)));

  const linha = m => {
    const tipo = getTipo(m);
    const tipoBadge = tipo === 'NOVA_ADESAO'
      ? '<span class="pill ok" style="font-weight:700">Nova Adesão</span>'
      : tipo === 'EX_ATLETA'
        ? '<span class="pill info" style="font-weight:700">Antigo Atleta</span>'
        : tipo === 'POR_CONFIRMAR'
          ? '<span class="pill warn" style="font-weight:700">Pagamento Pendente</span>'
          : '<span class="pill muted" style="font-weight:700">Registo Incompleto</span>';

    const sinais = [
      tipoBadge,
      m.sinais?.perfil ? '<span class="pill ok">Perfil</span>' : '',
      m.sinais?.treino ? '<span class="pill">Treino</span>' : '',
      m.sinais?.alimentacao ? '<span class="pill">Alimentação</span>' : '',
      m.sinais?.avaliacao ? '<span class="pill">Avaliações</span>' : '',
      m.sinais?.pagamentoConfirmado ? '<span class="pill ok">Pagamento confirmado</span>' : '',
      m.sinais?.onboarding ? '<span class="pill info">Onboarding concluído</span>' : '',
      m.sinais?.historicoCompleto ? '<span class="pill info">Histórico preservado</span>' : '',
      m.pagamentoPendente ? '<span class="pill warn">Pagamento pendente</span>' : ''
    ].filter(Boolean).join('');

    const acaoTexto = tipo === 'EX_ATLETA'
      ? `${ic('check')} Recuperar com histórico`
      : tipo === 'POR_CONFIRMAR'
        ? `${ic('check')} Confirmar pagamento e adicionar`
        : tipo === 'REGISTO_INCOMPLETO'
          ? `${ic('plus')} Adicionar atleta (sem pagamento)`
          : `${ic('plus')} Adicionar atleta`;

    const btnClass = tipo === 'EX_ATLETA' ? 'btn sm' : tipo === 'POR_CONFIRMAR' ? 'btn sm warn' : 'btn sm ok';
    const detalhe = m.descricaoOrigem || m.motivoTriage || m.tipoDescricao || '';

    const podeConfirmar = tipo === 'POR_CONFIRMAR';
    return `<div class="member" data-member-row="${esc(m.membroID)}">
      <div class="av">${esc(iniciais(m))}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <b>${esc(m.nomeCliente || 'Sem nome')}</b>
        </div>
        <small style="color:var(--text-muted)">${esc(m.emailCliente || m.membroID)}</small>
        <div class="pills" style="margin-top:6px">${sinais}</div>
        ${detalhe ? `<div style="font-size:12px;color:var(--text-muted);margin-top:5px;line-height:1.4">${esc(detalhe)}</div>` : ''}
      </div>
      <label class="fld" style="width:min(230px,100%);flex:0 1 230px"><span>Pack atual</span>
        <input data-member-pack value="${esc(m.packEscolhido || '')}" list="listaPacksAdd" placeholder="Selecionar pack" autocomplete="off">
      </label>
      <button type="button" class="${btnClass}" data-act="adicionar" data-membro="${esc(m.membroID)}" data-confirmar="${podeConfirmar ? 'true' : 'false'}">${acaoTexto}</button>
    </div>`;
  };

  const emptyMsg = membros === null
    ? '<div class="skel"></div><div class="skel"></div>'
    : lista.length
      ? lista.map(linha).join('')
      : (filtro !== 'TODOS'
        ? `<div class="empty"><strong>Sem registos nesta categoria (${esc(filtro)})</strong>Experimenta selecionar outra categoria ou limpar a pesquisa.</div>`
        : '<div class="empty"><strong>Nenhum atleta por ligar</strong>Todos os membros DIASFIT detetados já estão na gestão.</div>');

  return `<div class="f-back"><button type="button" class="btn ghost sm" data-act="voltar">${ic('back')} Painel</button></div>
  <section class="card">
    <div class="card-head">
      <div>
        <div class="eyebrow">Triagem e Entrada Segura v12.3</div>
        <h3>Adicionar ou recuperar atleta</h3>
        <p>Separação rigorosa entre novas adesões comprovadas, antigos atletas com histórico prévio, pagamentos pendentes e registos incompletos. A recuperação preserva integralmente o histórico sem duplicar fichas nem reativar atletas automaticamente.</p>
      </div>
    </div>
    <div class="banner" style="margin:0 0 14px;background:var(--okbg);border-color:#c9ddcf">
      <div>
        <strong>Triagem inteligente com evidências fiáveis</strong>
        <small>Novas adesões requerem pagamento confirmado recente ou onboarding novo. Pagamentos pendentes exigem confirmação administrativa inequívoca. Antigos atletas mantêm Perfil, treinos, alimentação e avaliações intactos.</small>
      </div>
    </div>
    <div class="tabs-membros" style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px">
      <button type="button" class="btn sm ${filtro === 'TODOS' ? 'primary' : 'ghost'}" data-act="filtroMembros" data-filtro="TODOS">Todos (${countTodos})</button>
      <button type="button" class="btn sm ${filtro === 'NOVOS' ? 'primary' : 'ghost'}" data-act="filtroMembros" data-filtro="NOVOS">${ic('sparkle')} Novas adesões (${countNovos})</button>
      <button type="button" class="btn sm ${filtro === 'ANTIGOS' ? 'primary' : 'ghost'}" data-act="filtroMembros" data-filtro="ANTIGOS">${ic('clock')} Antigos atletas (${countAntigos})</button>
      <button type="button" class="btn sm ${filtro === 'PENDENTES' ? 'primary' : 'ghost'}" data-act="filtroMembros" data-filtro="PENDENTES">${ic('alert')} Pagamentos pendentes (${countPendentes})</button>
      <button type="button" class="btn sm ${filtro === 'INCOMPLETOS' ? 'primary' : 'ghost'}" data-act="filtroMembros" data-filtro="INCOMPLETOS">${ic('user')} Registos incompletos (${countIncompletos})</button>
    </div>
    <div class="toolbar"><label class="search">${ic('search')}<span class="sr-only">Pesquisar membro</span><input type="search" id="pesquisaMembros" placeholder="Nome, email, pack ou motivo de triagem…" value="${esc(S.pesquisaMembros)}"></label></div>
    <datalist id="listaPacksAdd">${packsCatalogo().map(p => `<option value="${esc(p)}">`).join('')}</datalist>
    <div id="listaMembros">${emptyMsg}</div>
  </section>`;
}

ACT.preTreinoToggle = async btn => {
  const ctx = S.detalhe?.nutricaoContexto || {};
  const ids = new Set((ctx.resumo?.preTreinoIds || []).map(String));
  const id = String(btn.dataset.ref || '');
  if (!id) return;
  const alvo = (ctx.refeicoes || []).find(r => String(r.id) === id);
  if (ids.has(id)) {
    ids.delete(id);
  } else {
    // Uma refeição de pré-treino por plano: evita dois símbolos contraditórios.
    if (alvo) for (const r of (ctx.refeicoes || [])) if (String(r.plano) === String(alvo.plano)) ids.delete(String(r.id));
    ids.add(id);
  }
  busy(btn, true, 'A guardar…');
  try {
    await call('guardarNutricaoCanonica', { atletaRegistoId: S.fichaId, preTreinoIds: [...ids] }, 45000);

let pdfMakePromise = null;
function loadScriptAsync(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.crossOrigin = 'anonymous';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Falha ao carregar ' + src));
    document.head.appendChild(s);
  });
}

function ensurePdfMakeLoaded() {
  if (typeof window !== 'undefined' && window.pdfMake && window.pdfMake.createPdf) return Promise.resolve();
  if (pdfMakePromise) return pdfMakePromise;

  const cdns = [
    {
      core: 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js',
      fonts: 'https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js'
    },
    {
      core: 'https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/pdfmake.min.js',
      fonts: 'https://cdn.jsdelivr.net/npm/pdfmake@0.2.10/build/vfs_fonts.js'
    },
    {
      core: 'https://unpkg.com/pdfmake@0.2.10/build/pdfmake.min.js',
      fonts: 'https://unpkg.com/pdfmake@0.2.10/build/vfs_fonts.js'
    }
  ];

  pdfMakePromise = (async () => {
    for (const cdn of cdns) {
      try {
        if (!window.pdfMake) await loadScriptAsync(cdn.core);
        if (window.pdfMake && !window.pdfMake.vfs) await loadScriptAsync(cdn.fonts);
        if (window.pdfMake && window.pdfMake.createPdf) return;
      } catch (_) {}
    }
    throw new Error('Não foi possível inicializar o gerador de PDF. Verifica a tua ligação.');
  })();

  return pdfMakePromise;
}

let cachedDiasfitLogo = null;
async function getDiasfitLogoDataUrl() {
  if (cachedDiasfitLogo) return cachedDiasfitLogo;
  const logoUrl = 'https://static.wixstatic.com/media/43bd9d_1934138721b8402db1b15c55e685f3e6~mv2.png';
  try {

    const blob = await resp.blob();

      const reader = new FileReader();
      reader.onloadend = () => {
        cachedDiasfitLogo = reader.result;
        resolve(cachedDiasfitLogo);
      };

      reader.readAsDataURL(blob);

    throw new Error('Logótipo oficial DIASFIT indisponível ou inacessível. A exportação foi bloqueada para assegurar a conformidade da identidade visual.');
